<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>子零件开发任务列表</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --muted: #f3f6fa;
      --line: #dfe5ec;
      --line-strong: #cfd7e3;
      --text: #252a34;
      --secondary: #657083;
      --tertiary: #a5adba;
      --primary: #1769ff;
      --primary-hover: #0f5be6;
      --primary-weak: #eaf2ff;
      --success: #17a657;
      --warning: #f79009;
      --danger: #f04438;
      --purple: #9b51d0;
      --cyan: #1684d8;
      --green: #25c36a;
      --shadow: 0 18px 44px rgba(16, 24, 40, .16);
      --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-width: 1180px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.45;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      min-height: 100vh;
      padding: 20px 20px 30px;
      background: var(--surface);
      border-top: 1px solid #e7ebf2;
    }

    .page-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .page-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 280px;
    }

    .page-heading::before {
      content: "";
      width: 4px;
      height: 32px;
      border-radius: 4px;
      background: var(--primary);
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 750;
      letter-spacing: 0;
    }

    .page-subtitle {
      color: var(--secondary);
      font-size: 13px;
      margin-top: 4px;
    }

    .btn {
      height: 36px;
      min-width: 88px;
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      background: #fff;
      color: #3f4857;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 14px;
      font-weight: 500;
      white-space: nowrap;
      transition: .16s ease;
    }

    .btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: 0 6px 16px rgba(23, 105, 255, .12);
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      color: #fff;
    }

    .btn-plain {
      min-width: 72px;
      color: #555f6f;
      background: #fff;
    }

    .btn-soft {
      color: var(--primary);
      border-color: #b8d3ff;
      background: #eef5ff;
    }

    .add-icon {
      position: relative;
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
    }

    .add-icon::before,
    .add-icon::after {
      content: "";
      position: absolute;
      background: currentColor;
      border-radius: 2px;
    }

    .add-icon::before {
      width: 14px;
      height: 2px;
      top: 6px;
      left: 0;
    }

    .add-icon::after {
      width: 2px;
      height: 14px;
      top: 0;
      left: 6px;
    }

    .filter-panel {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(300px, 1fr) minmax(300px, 1fr) 1px auto;
      gap: 16px 32px;
      align-items: center;
      padding: 24px 18px;
      background: var(--muted);
      margin-bottom: 22px;
    }

    .filter-item {
      display: grid;
      grid-template-columns: 120px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
    }

    .filter-item label {
      text-align: right;
      color: #4d5868;
      white-space: nowrap;
    }

    .field,
    .select,
    .textarea {
      width: 100%;
      min-width: 0;
      height: 36px;
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      background: #fff;
      color: var(--text);
      padding: 0 12px;
      outline: none;
      transition: .16s ease;
    }

    .textarea {
      min-height: 82px;
      padding-top: 8px;
      resize: vertical;
    }

    .field::placeholder,
    .textarea::placeholder {
      color: #b5bac2;
    }

    .field:focus,
    .select:focus,
    .textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(23, 105, 255, .10);
    }

    .select {
      appearance: none;
      padding-right: 34px;
      background-image:
        linear-gradient(45deg, transparent 50%, #b8c0cc 50%),
        linear-gradient(135deg, #b8c0cc 50%, transparent 50%);
      background-position:
        calc(100% - 20px) 15px,
        calc(100% - 14px) 15px;
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      color: #6a7484;
    }

    .filter-divider {
      width: 1px;
      height: 84px;
      background: #dde3eb;
      grid-row: 1 / span 2;
      grid-column: 4;
    }

    .filter-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      grid-row: 1 / span 2;
      grid-column: 5;
      padding: 0 0 0 10px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .related-filter {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #344054;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
    }

    .related-filter input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .table-shell {
      border: 1px solid var(--line);
      background: #fff;
      overflow: auto;
      position: relative;
    }

    table {
      width: 100%;
      min-width: 1480px;
      border-collapse: collapse;
      table-layout: auto;
    }

    th,
    td {
      min-height: 48px;
      border-bottom: 1px solid #e6ebf1;
      padding: 13px 24px;
      text-align: left;
      color: #2e333c;
      vertical-align: middle;
      white-space: nowrap;
    }

    th {
      height: 48px;
      background: #f1f4f8;
      color: #2b3038;
      font-weight: 700;
    }

    tr:hover td {
      background: #fafcff;
    }

    .link {
      border: 0;
      background: transparent;
      color: #0066ff;
      padding: 0;
      font-weight: 600;
    }

    .link:hover {
      color: #004bcc;
    }

    .stage-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 58px;
      height: 24px;
      padding: 0 12px;
      border: 1px solid currentColor;
      border-radius: 999px;
      background: #fff;
      font-size: 13px;
      line-height: 1;
      white-space: nowrap;
    }

    .stage-gate1 { color: #f6a800; }
    .stage-gate2 { color: #ff4d4f; }
    .stage-gate3 { color: var(--purple); }
    .stage-gate4 { color: var(--cyan); }
    .stage-gate5 { color: var(--green); }
    .stage-gate6 { color: #8aa0a8; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-weight: 500;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
      flex: 0 0 auto;
      background: currentColor;
    }

    .status-blue { color: var(--primary); }
    .status-orange { color: var(--warning); }
    .status-red { color: var(--danger); }
    .status-green { color: var(--success); }
    .status-gray { color: #8aa0a8; }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 9px;
      border-radius: 999px;
      border: 1px solid #cfd7e3;
      background: #fff;
      color: #4d5868;
      font-size: 12px;
      white-space: nowrap;
    }

    .tag-blue {
      color: #175cd3;
      border-color: #b8d3ff;
      background: #eef5ff;
    }

    .tag-green {
      color: #087a2e;
      border-color: #b7ebc6;
      background: #effaf3;
    }

    .tag-orange {
      color: #b54708;
      border-color: #fedf89;
      background: #fff7e6;
    }

    .pagination {
      min-height: 92px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 26px;
      padding: 20px 0 0;
      background: #fff;
    }

    .page-size,
    .jump-control {
      height: 32px;
      border: 1px solid var(--line-strong);
      background: #fff;
      color: #374151;
      padding: 0 10px;
    }

    .pager {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #737b88;
    }

    .page-num,
    .page-arrow {
      min-width: 32px;
      height: 32px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      background: #fff;
      color: #303642;
    }

    .page-num.active {
      color: #fff;
      border-color: var(--primary);
      background: var(--primary);
    }

    .page-arrow {
      border-color: transparent;
      background: transparent;
      color: #1f2329;
      font-size: 22px;
    }

    .page-arrow[disabled] {
      color: #b8c0cc;
      cursor: not-allowed;
    }

    .ellipsis {
      min-width: 28px;
      text-align: center;
      color: #a0a7b3;
    }

    .drawer-mask {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(16, 24, 40, .32);
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease;
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 100;
      width: clamp(560px, 58vw, 980px);
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: var(--bg);
      box-shadow: var(--shadow);
      transform: translateX(104%);
      transition: transform .26s ease;
    }

    body.drawer-open {
      overflow: hidden;
    }

    body.drawer-open .drawer-mask {
      opacity: 1;
      pointer-events: auto;
    }

    body.drawer-open .drawer {
      transform: translateX(0);
    }

    .drawer-head {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 22px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .drawer-title {
      display: grid;
      gap: 4px;
    }

    .drawer-title h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }

    .drawer-title span {
      color: var(--secondary);
      font-size: 13px;
    }

    .drawer-close {
      width: 34px;
      height: 34px;
      border: 0;
      background: transparent;
      color: #8b93a1;
      font-size: 28px;
      line-height: 1;
    }

    .drawer-body {
      padding: 20px 22px 96px;
      overflow: auto;
    }

    .drawer form {
      min-height: 0;
      display: grid;
      grid-template-rows: 1fr auto;
      overflow: hidden;
    }

    .form-card {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      margin-bottom: 18px;
      overflow: visible;
    }

    .form-section-title {
      margin: 0 20px;
      padding: 18px 0 12px;
      border-bottom: 1px solid #edf0f4;
      font-size: 16px;
      font-weight: 800;
    }

    .form-section-title span {
      margin-left: 6px;
      color: #4d5868;
      font-weight: 600;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 22px 20px;
      padding: 22px 20px 24px;
    }

    .form-field {
      min-width: 0;
    }

    .form-field.wide {
      grid-column: 1 / -1;
    }

    .form-field.full {
      grid-column: 1 / -1;
    }

    .form-field label {
      display: block;
      min-height: 22px;
      margin-bottom: 7px;
      color: #141820;
      font-weight: 500;
    }

    .required::after {
      content: " *";
      color: var(--danger);
      font-weight: 700;
    }

    .error-text {
      min-height: 18px;
      margin-top: 5px;
      color: var(--danger);
      font-size: 12px;
    }

    .inline-grid {
      display: grid;
      grid-template-columns: 170px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }

    .field-note {
      margin-top: 8px;
      color: var(--secondary);
      font-size: 12px;
      line-height: 1.5;
    }

    .owner-picker {
      width: 100%;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      background: #fff;
      color: var(--text);
      padding: 0 12px;
      text-align: left;
      transition: .16s ease;
    }

    .owner-picker:hover,
    .owner-picker:focus-visible {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(23, 105, 255, .10);
      outline: none;
    }

    .owner-picker.invalid {
      border-color: var(--danger);
    }

    .owner-picker-placeholder {
      color: #9aa2af;
    }

    .owner-picker svg {
      flex: 0 0 auto;
      color: #98a2b3;
    }

    .field[readonly] {
      background: #f7f8fa;
      color: #475467;
      cursor: default;
    }

    .org-modal-layer {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(16, 24, 40, .48);
    }

    .org-modal-layer[hidden] {
      display: none;
    }

    .org-modal {
      width: min(940px, 100%);
      max-height: min(720px, calc(100vh - 48px));
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 24px 64px rgba(16, 24, 40, .24);
    }

    .org-modal-head,
    .org-modal-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
    }

    .org-modal-head h3 {
      margin: 0;
      font-size: 17px;
    }

    .org-modal-head p {
      margin: 4px 0 0;
      color: var(--secondary);
      font-size: 12px;
    }

    .org-modal-close {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 0;
      background: transparent;
      color: #7b8493;
    }

    .org-modal-body {
      min-height: 0;
      padding: 20px;
      overflow: auto;
    }

    .org-transfer {
      min-height: 360px;
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) 54px minmax(240px, .8fr);
      align-items: stretch;
    }

    .org-panel {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: #fff;
    }

    .org-selected-list {
      padding: 12px;
    }

    .org-member-option {
      min-height: 56px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 5px;
      cursor: pointer;
      transition: .16s ease;
    }

    .org-member-option:hover {
      border-color: #9fc2ff;
      background: #f7faff;
    }

    .org-member-option:has(input:checked) {
      border-color: var(--primary);
      background: #eef5ff;
    }

    .org-member-option input {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
    }

    .org-person-name {
      display: block;
      color: #1d2939;
      font-weight: 700;
    }

    .org-selected-card {
      padding: 12px;
      border: 1px solid #b8d3ff;
      border-radius: 5px;
      background: #eef5ff;
    }

    .org-empty {
      padding: 44px 14px;
      color: var(--secondary);
      text-align: center;
      line-height: 1.6;
    }

    .org-selection-error {
      min-height: 18px;
      margin-top: 10px;
      color: var(--danger);
      font-size: 12px;
    }

    .org-modal-foot {
      justify-content: space-between;
      border-top: 1px solid var(--line);
      border-bottom: 0;
    }

    .org-modal {
      width: min(1100px, 100%);
      max-height: min(780px, calc(100vh - 32px));
    }

    .org-modal-head {
      min-height: 82px;
      padding: 16px 32px;
    }

    .org-modal-head h3 {
      font-size: 16px;
    }

    .org-modal-head p {
      font-size: 13px;
      font-weight: 600;
    }

    .org-modal-head-actions,
    .org-foot-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .org-context-tag {
      border-radius: 4px;
      background: #f5f7fa;
      color: #475467;
      padding: 7px 12px;
      font-size: 13px;
    }

    .org-modal-body {
      padding: 28px 32px 16px;
    }

    .org-transfer {
      min-height: 500px;
      grid-template-columns: minmax(0, 1fr) 72px minmax(0, 1fr);
      gap: 0;
    }

    .org-transfer-column {
      min-width: 0;
      display: grid;
      grid-template-rows: 34px minmax(0, 1fr);
    }

    .org-column-caption {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      color: #344054;
      font-size: 13px;
      font-weight: 700;
    }

    .org-column-caption > span:first-child {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .org-column-caption b {
      min-width: 28px;
      border-radius: 4px;
      background: #f1f4f8;
      padding: 3px 8px;
      text-align: center;
      font-size: 12px;
    }

    .org-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .org-dot-blue {
      background: var(--primary);
    }

    .org-dot-green {
      background: #12a66a;
    }

    .org-caption-actions {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .org-caption-actions button,
    .org-clear-button {
      border: 0;
      background: transparent;
      color: var(--primary);
      padding: 0;
      font-size: 12px;
      font-weight: 700;
    }

    .org-caption-actions i {
      width: 1px;
      height: 13px;
      background: var(--line-strong);
    }

    .org-clear-button {
      color: var(--danger);
    }

    .org-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      border-radius: 6px;
    }

    .org-panel-selected {
      border-color: #8bddba;
      background: #fbfffd;
    }

    .org-search-wrap {
      position: relative;
      margin: 12px 16px;
    }

    .org-search-wrap svg {
      position: absolute;
      top: 50%;
      left: 12px;
      transform: translateY(-50%);
      color: #98a2b3;
      pointer-events: none;
    }

    .org-search-wrap input {
      width: 100%;
      height: 34px;
      border: 1px solid var(--line-strong);
      border-radius: 3px;
      outline: none;
      padding: 0 12px 0 38px;
      color: #344054;
    }

    .org-search-wrap input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(23, 105, 255, .1);
    }

    .org-group-list,
    .org-selected-list {
      min-height: 0;
      overflow: auto;
      border-top: 1px solid var(--line);
      padding: 0 10px 12px;
    }

    .org-group {
      border-bottom: 1px solid #edf0f4;
    }

    .org-group-head {
      width: 100%;
      min-height: 48px;
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      border: 0;
      background: transparent;
      color: #273142;
      padding: 0 8px;
      text-align: left;
      font-weight: 800;
    }

    .org-group-head:hover {
      background: #f7faff;
    }

    .org-group-chevron {
      color: #98a2b3;
      transition: transform .16s ease;
    }

    .org-group-head[aria-expanded="true"] .org-group-chevron {
      transform: rotate(90deg);
    }

    .org-group-count {
      color: #98a2b3;
      font-size: 12px;
      font-weight: 700;
    }

    .org-member-option {
      min-height: 54px;
      grid-template-columns: auto 30px minmax(0, 1fr);
      margin: 0 6px 6px 34px;
      border-color: transparent;
      padding: 7px 8px;
    }

    .org-member-option:has(input:checked) {
      border-color: #87b4ff;
      background: #f2f7ff;
    }

    .org-avatar {
      width: 30px;

      const classMap = {
        Gate1: "stage-gate1",
        Gate2: "stage-gate2",
        Gate3: "stage-gate3",
        Gate4: "stage-gate4",
        Gate5: "stage-gate5",
        Gate6: "stage-gate6"
      };
      return `<span class="stage-pill ${classMap[stage] || "stage-gate1"}">${escapeHtml(stage)}</span>`;
    }

    function statusMarkup(status) {
      const classMap = {
        "未启动": "status-gray",
        "进行中": "status-blue",
        "当前 Gate 待完成": "status-orange",
        "待影响分析": "status-orange",
        "变更待确认": "status-red",
        "已完成": "status-green"
      };
      return `<span class="status ${classMap[status] || "status-blue"}"><span class="dot"></span>${escapeHtml(status)}</span>`;
    }

    function sourceMarkup(source) {
      const className = source === "BOM 创建" ? "tag-blue" : "tag-green";
      return `<span class="tag ${className}">${escapeHtml(source)}</span>`;
    }

    function renderTasks(rows = tasks) {
      taskTableBody.innerHTML = rows.map((task) => `
        <tr>
          <td>${escapeHtml(task.id)}</td>
          <td>${escapeHtml(task.partName)}</td>
          <td>${escapeHtml(task.project)}</td>
          <td>${escapeHtml(task.quality)}</td>
          <td>${escapeHtml(task.owner)}</td>
          <td>${escapeHtml(task.department)}</td>
          <td>${escapeHtml(task.supplier || "-")}</td>
          <td>${sourceMarkup(task.source)}</td>
          <td>${stageMarkup(task.gate)}</td>
          <td>${statusMarkup(task.status)}</td>
          <td><button class="link" type="button" data-detail="${escapeHtml(task.id)}">详情</button></td>
        </tr>
      `).join("");
    }

    function findOrganizationPerson(name) {
      for (const group of organizationData) {
        const person = group.members.find((member) => member.name === name);
        if (person) return { ...person, department: group.department };
      }
      return null;
    }

    function personInitials(name) {
      return name.split(/\s+/).map((part) => part[0] || "").join("").slice(0, 2).toUpperCase();
    }

    function renderOrganizationPicker() {
      const availableQuery = orgAvailableSearch.value.trim().toLowerCase();
      const totalMembers = organizationData.reduce((total, group) => total + group.members.length, 0);
      availableOwnerCount.textContent = totalMembers;
      const visibleGroups = organizationData.map((group) => {
        const departmentMatches = group.department.toLowerCase().includes(availableQuery);
        const members = group.members.filter((member) => {
          const searchable = `${member.name} ${member.role} ${member.email}`.toLowerCase();
          return !availableQuery || departmentMatches || searchable.includes(availableQuery);
        });
        return { ...group, members, totalCount: group.members.length };
      }).filter((group) => group.members.length);

      orgDepartmentList.innerHTML = visibleGroups.length ? visibleGroups.map((group) => {
        const expanded = availableQuery || expandedDepartments.has(group.department);
        const selectedCount = group.members.some((member) => member.name === pendingOwner) ? 1 : 0;
        return `
          <section class="org-group">
            <button class="org-group-head" type="button" data-toggle-department="${escapeHtml(group.department)}" aria-expanded="${Boolean(expanded)}">
              <svg class="org-group-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 18 6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span>${escapeHtml(group.department)}</span>
              <span class="org-group-count">${selectedCount}/${group.totalCount}</span>
            </button>
            ${expanded ? group.members.map((member) => `
              <label class="org-member-option">
                <input type="radio" name="availableOwnerCandidate" value="${escapeHtml(member.name)}" ${member.name === highlightedOwner ? "checked" : ""}>
                <span class="org-avatar">${escapeHtml(personInitials(member.name))}</span>
                <span class="org-person-line">
                  <span class="org-person-name">${escapeHtml(member.name)}</span>
                  <span class="org-person-role">${escapeHtml(member.role)}</span>
                  <span class="org-person-email">${escapeHtml(member.email)}</span>
                  ${member.name === pendingOwner ? `<span class="org-member-selected-state">已选</span>` : ""}
                </span>
              </label>
            `).join("") : ""}
          </section>
        `;
      }).join("") : `<div class="org-no-results">未找到匹配的部门或成员<br>请尝试姓名、岗位或邮箱关键词</div>`;

      const selectedPerson = findOrganizationPerson(pendingOwner);
      const selectedQuery = orgSelectedSearch.value.trim().toLowerCase();
      const selectedMatches = selectedPerson && (!selectedQuery || `${selectedPerson.name} ${selectedPerson.role} ${selectedPerson.email} ${selectedPerson.department}`.toLowerCase().includes(selectedQuery));
      selectedOwnerCount.textContent = selectedPerson ? "1" : "0";
      selectedOwnerSummary.textContent = selectedPerson ? "1" : "0";
      selectedOwnerCard.innerHTML = selectedMatches ? `
        <div class="org-selected-group">
          <div class="org-selected-group-head"><span>${escapeHtml(selectedPerson.department)}</span><span>1人</span></div>
          <div class="org-selected-card">
            <span class="org-avatar">${escapeHtml(personInitials(selectedPerson.name))}</span>
            <span class="org-person-line">
              <span class="org-person-name">${escapeHtml(selectedPerson.name)}</span>
              <span class="org-person-role">${escapeHtml(selectedPerson.role)}</span>
              <span class="org-person-email">${escapeHtml(selectedPerson.email)}</span>
            </span>
            <button class="org-selected-remove" type="button" data-remove-selected-owner aria-label="移除 ${escapeHtml(selectedPerson.name)}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>
      ` : selectedPerson ? `<div class="org-no-results">当前已选负责人不匹配搜索条件</div>` : `<div class="org-empty">尚未选择负责人<br>请从左侧单选成员后点击右移按钮</div>`;
      addOwnerToSelection.disabled = !highlightedOwner || highlightedOwner === pendingOwner;
      removeOwnerSelection.disabled = !pendingOwner;
    }

    function setOrganizationModal(open) {
      orgModal.hidden = !open;
      ownerPicker.setAttribute("aria-expanded", String(open));
      if (open) {
        pendingOwner = ownerInput.value;
        highlightedOwner = pendingOwner;
        expandedDepartments = new Set(organizationData.map((group) => group.department));
        orgAvailableSearch.value = "";
        orgSelectedSearch.value = "";
        orgSelectionError.textContent = "";
        renderOrganizationPicker();
        orgAvailableSearch.focus();
      } else {
        ownerPicker.focus();
      }
    }

    function applySelectedOwner() {
      const selectedPerson = findOrganizationPerson(pendingOwner);
      if (!selectedPerson) {
        orgSelectionError.textContent = "请选择一名负责人";
        return;
      }
      ownerInput.value = selectedPerson.name;
      ownerPickerText.textContent = selectedPerson.name;
      ownerPickerText.classList.remove("owner-picker-placeholder");
      departmentInput.value = selectedPerson.department;
      ownerPicker.classList.remove("invalid");
      taskForm.querySelector('[data-error-for="owner"]').textContent = "";
      taskForm.querySelector('[data-error-for="department"]').textContent = "";
      departmentInput.style.borderColor = "";
      setOrganizationModal(false);
    }

    function syncPartSourceMode() {
      const isSap = partSourceMode.value === "sap";
      sapPartSelect.hidden = !isSap;
      sapPartSelect.toggleAttribute("disabled", !isSap);
      partNameInput.hidden = isSap;
      if (isSap) {
        partNameInput.value = sapPartSelect.value || "";
      } else {
        sapPartSelect.value = "";
      }
    }

    function syncSapPartSelection() {
      if (partSourceMode.value !== "sap") return;
      partNameInput.value = sapPartSelect.value || "";
    }

    function setDrawer(open) {
      document.body.classList.toggle("drawer-open", open);
      if (!open) {
        orgModal.hidden = true;
        ownerPicker.setAttribute("aria-expanded", "false");
      }
      if (open) {
        document.querySelector("#sapPartSelect").focus();
      }
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function valueOf(selector) {
      const element = document.querySelector(selector);
      return element ? element.value.trim() : "";
    }

    function validateForm() {
      let valid = true;
      taskForm.querySelectorAll("[data-required]").forEach((field) => {
        const error = taskForm.querySelector(`[data-error-for="${field.id}"]`);
        const isEmpty = !field.value.trim();
        if (error) {
          error.textContent = isEmpty ? `请填写${field.dataset.required}` : "";
        }
        if (field.id === "owner") {
          ownerPicker.classList.toggle("invalid", isEmpty);
        } else {
          field.style.borderColor = isEmpty ? "var(--danger)" : "";
        }
        valid = valid && !isEmpty;
      });
      const partError = taskForm.querySelector('[data-error-for="partName"]');
      if (partError) {
        partError.textContent = partNameInput.value.trim() ? "" : "请选择或填写零件名称";
      }
      sapPartSelect.style.borderColor = !partNameInput.value.trim() && partSourceMode.value === "sap" ? "var(--danger)" : "";
      return valid;
    }

    function collectTask(statusOverride) {
      return {
        id: valueOf("#taskNo"),
        partName: valueOf("#partName"),
        project: valueOf("#projectName") || "-",
        quality: valueOf("#qualityProcess"),
        owner: valueOf("#owner"),
        department: valueOf("#department"),
        supplier: "-",
        source: "手动新增",
        gate: "Gate1",
        status: statusOverride || "未启动"
      };
    }

    function resetForm() {
      taskForm.reset();
      const now = new Date();
      const dateCode = `${String(now.getFullYear()).slice(-2)}${String(now.getMonth() + 1).padStart(2, "0")}${String(now.getDate()).padStart(2, "0")}`;
      const prefix = `APQP-${dateCode}-`;
      const dailyMax = tasks
        .map((task) => task.id || "")
        .filter((id) => id.startsWith(prefix))
        .reduce((max, id) => Math.max(max, Number(id.slice(prefix.length)) || 0), 0);
      document.querySelector("#taskNo").value = `${prefix}${String(dailyMax + 1).padStart(3, "0")}`;
      document.querySelector("#qualityProcess").value = "Full APQP process";
      document.querySelector("#partSourceMode").value = "sap";
      document.querySelector("#sapPartSelect").value = "";
      document.querySelector("#partName").value = "";
      document.querySelector("#partName").hidden = true;
      document.querySelector("#sapPartSelect").hidden = false;
      ownerInput.value = "";
      ownerPickerText.textContent = "请选择负责人";
      ownerPickerText.classList.add("owner-picker-placeholder");
      ownerPicker.classList.remove("invalid");
      departmentInput.value = "";
      taskForm.querySelectorAll(".error-text").forEach((error) => {
        error.textContent = "";
      });
      taskForm.querySelectorAll("[data-required]").forEach((field) => {
        field.style.borderColor = "";
      });
      sapPartSelect.style.borderColor = "";
    }

    function submitTask(statusOverride) {
      if (!validateForm()) return;
      const task = collectTask(statusOverride);
      tasks.unshift(task);
      renderTasks();
      resetForm();
      setDrawer(false);
      showToast(statusOverride === "未启动" ? "草稿已保存为未启动任务" : "子零件开发任务已创建");
    }

    function applyFilter() {
      const partName = valueOf("#partNameFilter").toLowerCase();
      const project = valueOf("#projectFilter").toLowerCase();
      const quality = valueOf("#qualityFilter");
      const gate = valueOf("#gateFilter");
      const status = valueOf("#statusFilter");
      const filtered = tasks.filter((task) => {
        return (!partName || task.partName.toLowerCase().includes(partName))
          && (!project || task.project.toLowerCase().includes(project))
          && (!quality || task.quality === quality)
          && (!gate || task.gate === gate)
          && (!status || task.status === status)
          && (!relatedOnlyFilter.checked || task.owner === currentUser);
      });
      renderTasks(filtered);
    }

    document.querySelector("#openDrawer").addEventListener("click", () => setDrawer(true));
    document.querySelector("#closeDrawer").addEventListener("click", () => setDrawer(false));
    document.querySelector("#cancelDrawer").addEventListener("click", () => setDrawer(false));
    drawerMask.addEventListener("click", () => setDrawer(false));
    document.querySelector("#saveDraft").addEventListener("click", () => submitTask("未启动"));
    ownerPicker.addEventListener("click", () => setOrganizationModal(true));
    document.querySelector("#closeOrgModal").addEventListener("click", () => setOrganizationModal(false));
    document.querySelector("#cancelOrgModal").addEventListener("click", () => setOrganizationModal(false));
    document.querySelector("#confirmOrgOwner").addEventListener("click", applySelectedOwner);
    orgModal.addEventListener("click", (event) => {
      if (event.target === orgModal) setOrganizationModal(false);
    });
    orgDepartmentList.addEventListener("click", (event) => {
      const departmentButton = event.target.closest("[data-toggle-department]");
      if (!departmentButton) return;
      const department = departmentButton.dataset.toggleDepartment;
      if (expandedDepartments.has(department)) {
        expandedDepartments.delete(department);
      } else {
        expandedDepartments.add(department);
      }
      renderOrganizationPicker();
    });
    orgDepartmentList.addEventListener("change", (event) => {
      if (event.target.name !== "availableOwnerCandidate") return;
      highlightedOwner = event.target.value;
      orgSelectionError.textContent = "";
      renderOrganizationPicker();
    });
    orgAvailableSearch.addEventListener("input", renderOrganizationPicker);
    orgSelectedSearch.addEventListener("input", renderOrganizationPicker);
    document.querySelector("#expandAllDepartments").addEventListener("click", () => {
      expandedDepartments = new Set(organizationData.map((group) => group.department));
      renderOrganizationPicker();
    });
    document.querySelector("#collapseAllDepartments").addEventListener("click", () => {
      expandedDepartments.clear();
      renderOrganizationPicker();
    });
    addOwnerToSelection.addEventListener("click", () => {
      if (!highlightedOwner) return;
      pendingOwner = highlightedOwner;
      orgSelectionError.textContent = "";
      renderOrganizationPicker();
    });
    removeOwnerSelection.addEventListener("click", () => {
      pendingOwner = "";
      renderOrganizationPicker();
    });
    document.querySelector("#clearSelectedOwner").addEventListener("click", () => {
      pendingOwner = "";
      renderOrganizationPicker();
    });
    selectedOwnerCard.addEventListener("click", (event) => {
      if (!event.target.closest("[data-remove-selected-owner]")) return;
      pendingOwner = "";
      renderOrganizationPicker();
    });
    partSourceMode.addEventListener("change", () => {
      syncPartSourceMode();
      syncSapPartSelection();
    });
    sapPartSelect.addEventListener("change", syncSapPartSelection);
    taskForm.addEventListener("submit", (event) => {
      event.preventDefault();
      submitTask();
    });
    document.querySelector("#searchButton").addEventListener("click", applyFilter);
    relatedOnlyFilter.addEventListener("change", applyFilter);
    document.querySelector("#resetButton").addEventListener("click", () => {
      document.querySelector("#partNameFilter").value = "";
      document.querySelector("#projectFilter").value = "";
      document.querySelector("#qualityFilter").value = "";
      document.querySelector("#gateFilter").value = "";
      document.querySelector("#statusFilter").value = "";
      relatedOnlyFilter.checked = true;
      applyFilter();
    });
    taskTableBody.addEventListener("click", (event) => {
      const detailButton = event.target.closest("[data-detail]");
      if (detailButton) {
        window.location.href = `${detailUrl}?taskId=${encodeURIComponent(detailButton.dataset.detail)}`;
      }
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        if (!orgModal.hidden) {
          setOrganizationModal(false);
        } else if (document.body.classList.contains("drawer-open")) {
          setDrawer(false);
        }
      }
    });

    applyFilter();
    syncPartSourceMode();
  </script>
</body>
</html>
