function validateLines(lines){
  if(!lines.length)return 'BOM 为空，请先添加一个根零件。';
  const roots=lines.filter(row=>!row.parent);
  if(!roots.length)return 'BOM 至少需要一个无父级的根零件。';
  for(const row of lines){
    if(!Number.isInteger(Number(row.level))||Number(row.level)<1||Number(row.level)>4)return '层级必须为 1 至 4 的整数。';
    if(!String(row.name||'').trim()||!String(row.bwNo||'').trim())return '请补全所有 BOM 行的名称与 BW 零件号。';
    if(!Number.isFinite(Number(row.qty))||Number(row.qty)<=0)return '数量必须为大于 0 的数字。';
    if(row.parent&&!lines.some(parent=>parent.id===row.parent&&Number(parent.level)===Number(row.level)-1))return '请为每条子级选择正确的上一级父零件。';
  }
  return '';
}

function decorateOriginalBomEditor(host,reviewerEditing=false,titleText='编辑 BOM'){

function approvalEventStage(event){const submission=event.eventType==='submission'||/提交|启用顺序确认/.test(event.action);return submission?actorLabel(event.role)+(/重新提交/.test(event.action)?' 调整后重新提交':/编辑后提交/.test(event.action)?' 编辑后提交':' 提交'):event.role==='AE'?'AE 提交':actorLabel(event.role)+' 确认';}

function showApprovalHistory(b){
  if(!b)return;

    const history=Array.isArray(version.approvalHistory)?version.approvalHistory:[],confirmations=confirmationOf(version);

  });

    const events=[...(version.approvalHistory||[])].reverse();
    const rows=events.map(event=>({version,roleName:event.role,stage:approvalEventStage(event),user:event.user,time:event.submittedAt||event.time,state:approvalEventState(event),detail:`第 ${event.round||1} 轮 · ${event.opinion||event.action}`,index:0}));
