<div class="app"><main class="content"><div class="page-head"><div><h1>生产 BOM 管理</h1><p>AE 维护并提交工作版本，SCM 和 ME 进行确认；双方确认后生成锁定生效版本。</p></div><div class="head-actions"><select id="role" class="filter" aria-label="当前角色"><option value="AE">Li Ming · AE</option><option value="SCM">Chen Wei · SCM</option><option value="ME">Zhang Lei · ME</option></select><button class="btn" id="exportList">导出 BOM</button><button class="btn primary" id="create">编辑 BOM</button></div></div>
<section class="panel"><nav class="tabs" id="tabs" aria-label="BOM 来源"><button class="tab" data-tab="全部">全部 BOM</button><button class="tab active" data-tab="项目开发" aria-current="page">项目开发</button><button class="tab" data-tab="零件 APQP">零件 APQP</button><button class="tab" data-tab="手动创建">手动创建</button></nav><div class="review-summary" id="reviewSummary" aria-label="BOM 版本确认概览" aria-live="polite"></div>
<div class="toolbar"><div class="filters"><input type="hidden" id="status" value=""><input id="search" class="search" style="width:170px" placeholder="L1 总成编号" aria-label="L1 总成编号"><input id="nameSearch" class="search" style="width:200px" placeholder="L1 总成名称" aria-label="L1 总成名称"><input id="projectFilterSearch" class="search" style="width:250px" placeholder="关联项目编号或名称" aria-label="关联项目"><input class="search" style="width:175px" id="versionSearch" placeholder="生效 / 工作版本" aria-label="搜索版本"><button class="btn primary" id="query">查询</button><button class="btn" id="reset">重置</button></div></div>
<div class="toolbar"><div class="filters"><span id="selectionText" class="notice">已选 0 项</span><button class="btn" id="submitBatch">提交确认</button><button class="btn primary" id="confirmBatch">批量确认</button><button class="btn" id="copySelected">复制 BOM 数据</button></div></div><div class="table-wrap"><table class="data-table" aria-label="BOM 清单"><thead><tr><th><input type="checkbox" id="selectAll" aria-label="选择全部筛选结果"></th><th>L1 总成编号</th><th>L1 总成名称</th><th>创建来源</th><th>关联项目</th><th>当前生效版本</th><th>生效版本所出阶段</th><th>最新工作版本</th><th>状态</th><th>变更履历</th><th>项目负责人</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pagination"><span id="count"></span><span>完整展示筛选结果 · 支持横向滚动查看全部字段</span></div></section>

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

const KEY='bw-independent-bom-v1', roles={AE:'Li Ming',SCM:'Chen Wei',ME:'Zhang Lei'}, gates=['PKO','Gate1','Gate2','Gate3','Gate4','Gate5','Gate6'];

function line(level,name,bwNo,parent=''){return {id:uid('LINE'),application:'VFS',level,name,qty:1,customerNo:'C-'+bwNo,bwNo,drawingRev:'A',sampleSapNo:'P-'+bwNo,massSapNo:'S-'+bwNo,rawNo:'RM-AL-6061',rawMaterial:'Aluminum',weightPiece:42.5,weightAssembly:42.5,sharedPart:'否',borrowedProject:'',releaseStatus:'R1',rawSupplier:'Ningbo Alloy',subSupplier:'BW Ningbo',supplyType:'一供',change:'无变更',remark:'',parent,needApqp:'是',needTask:level===1?'否':'是',owner:level===1?'Zhang Lei':'Wang Fang',gate:'Gate1',risk:'是',plans:level===1?[]:[{id:uid('SP'),supplier:'宁波精工',type:'一供',strategy:'单一供应',develop:'是',apqp:'是',risk:'是',gate:'Gate1',owner:'Wang Fang'}]};}

let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed();if(!Array.isArray(db))throw Error();}catch{db=seed();}db.forEach(b=>b.versions.forEach(v=>{if(['待 SCM 确认','待双方确认'].includes(v.status))v.status='待确认';v.confirmations={SCM:Boolean(v.confirmations?.SCM),ME:Boolean(v.confirmations?.ME)};v.confirmationNotes=v.confirmationNotes||{};}));try{localStorage.setItem(KEY,JSON.stringify(db));}catch{}
let tab='项目开发',selected=new Set(),visible=[],stack=[],draft=null,editing=null,detail=null,workflowFilter='all';
const latest=b=>b.versions[b.versions.length-1], active=b=>b.versions.find(v=>v.status==='已锁定生效'), root=v=>v.lines.find(l=>Number(l.level)===1), role=()=>$('#role').value;

function versionLabel(name){return String(name||'').replace(/^.+?_(?=V\d+(?:\.\d+)?$)/i,'');}
function versionStage(name){const match=String(name||'').match(/^(.+?)_V\d/i);return match?match[1]:'—';}

  const value=(row,key)=>{
    if(key==='level')return `<span class="level-badge level-${Math.min(4,Number(row.level)||1)}">L${esc(row.level)}</span>`;
    if(key==='name')return `<span class="tree-name"><span class="tree-indent" style="--indent:${Number(row.level)||1}"></span>${Number(row.level)<4?'<span class="tree-plus">+</span>':''}${esc(row.name||'—')}</span>`;
    if(key==='supplyType')return esc(supplyText(row));
    if(key==='change')return `<span class="tag ${row.change&&row.change!=='无变更'?'warn':''}">${esc(row.change||'无变更')}</span>`;
    return esc(row[key]??'—')||'—';
  };
  const selectedVersion=()=>b.versions.find(item=>item.id===$('[data-history-version]',el).value)||v;
  const renderHistory=()=>{
    const snapshot=selectedVersion();
    const current=latest(b),effective=active(b);
    const versionStatus=snapshot===effective?'当前生效版本':snapshot===current?'当前工作版本':['已锁定生效','已作废'].includes(snapshot.status)?'历史生效版本':'历史工作版本';
    $('[data-history-status]',el).value=versionStatus;
    $('[data-history-head]',el).innerHTML=`<tr><th>序号<span>No.</span></th>${fields.map(([,cn,en])=>`<th>${cn}<span>${en}</span></th>`).join('')}</tr>`;
    $('[data-history-body]',el).innerHTML=snapshot.lines.map((row,index)=>`<tr><td>${index+1}</td>${fields.map(([key])=>`<td>${value(row,key)}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${fields.length+1}" class="empty">当前版本暂无 BOM 明细</td></tr>`;
  };
  $('[data-history-version]',el).onchange=renderHistory;
  $('[data-action="exportHistory"]',el).onclick=()=>exportBoms([{b,v:selectedVersion()}]);
  renderHistory();
};
document.addEventListener('click',event=>{
  const button=event.target.closest('#rows [data-action="edit"]');
  if(!button)return;
  const bom=db.find(item=>item.id===button.dataset.id);
  if(!bom)return;
  const actor=role(),canEdit=actor==='AE'&&canManage(bom)&&!isPending(latest(bom))||['SCM','ME'].includes(actor)&&isPending(latest(bom));
  if(!canEdit){toast('当前角色不能编辑此 BOM 版本。');return;}
  event.preventDefault();
  event.stopImmediatePropagation();
  openOriginalBomEditor(bom);
},true);
$('#tabs').addEventListener('click',()=>{workflowFilter='all';},true);
document.addEventListener('click',event=>{
  const reviewCard=event.target.closest('[data-workflow-filter]');
  if(reviewCard){workflowFilter=reviewCard.dataset.workflowFilter;selected.clear();render();return;}
  const action=event.target.closest('#rows [data-action="confirm"]');
  if(!action)return;
  const bom=db.find(item=>item.id===action.dataset.id);if(!bom)return;
  event.preventDefault();event.stopImmediatePropagation();
  batch([bom.id],true);
},true);
document.addEventListener('change',event=>{if(event.target.id==='selectAll'){selected=new Set(event.target.checked?visible.filter(canSelect).map(b=>b.id):[]);render()}});
workflowFilter='all';
render();
const initialRoute=new URLSearchParams(location.search),initialBom=db.find(b=>b.id===initialRoute.get('edit')||b.id===initialRoute.get('copy'));
if(initialBom){history.replaceState({},'',location.pathname);if(canManage(initialBom))setTimeout(()=>openOriginalBomEditor(initialBom),0);else setTimeout(()=>toast('当前登录人不是项目负责人，仅可查看此 BOM。'),0);}
</script></body></html>
