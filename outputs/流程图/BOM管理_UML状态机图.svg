<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1430" viewBox="0 0 1500 1430"><title>BOM 工作版本 UML 状态机图</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#60666d"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="20" y="20" width="1460" height="1385" rx="5" fill="white" stroke="#60666d" stroke-width="1.6"/><path d="M20 20 H390 V52 L368 74 H20 Z" fill="#f6f6f6" stroke="#60666d" stroke-width="1.6"/><text x="42" y="55.0" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="normal" fill="#263544"><tspan x="42" dy="0">BOM 工作版本状态机图</tspan></text><text x="750" y="110.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="normal" fill="#263544"><tspan x="750" dy="0">正常流转沿中轴向下；退回与重提分别走两侧路径</tspan></text><circle cx="750" cy="165" r="11" fill="#111"/><rect x="580" y="215" width="340" height="100" rx="16" fill="white" stroke="#697582" stroke-width="1.6"/><text x="750" y="247.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#263544"><tspan x="750" dy="0">工作草稿／待提交</tspan></text><path d="M580 265 H920" fill="none" stroke="#c4c9ce"/><text x="750" y="294.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="normal" fill="#60666d"><tspan x="750" dy="0">内部处理：编辑、保存草稿</tspan></text><rect x="580" y="450" width="340" height="100" rx="16" fill="white" stroke="#697582" stroke-width="1.6"/><text x="750" y="482.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#263544"><tspan x="750" dy="0">待 SCM 确认</tspan></text><path d="M580 500 H920" fill="none" stroke="#c4c9ce"/><text x="750" y="529.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="normal" fill="#60666d"><tspan x="750" dy="0">内部处理：编辑供应商信息、保存</tspan></text><rect x="580" y="750" width="340" height="100" rx="16" fill="white" stroke="#697582" stroke-width="1.6"/><text x="750" y="782.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#263544"><tspan x="750" dy="0">待其他人员确认</tspan></text><path d="M580 800 H920" fill="none" stroke="#c4c9ce"/><text x="750" y="829.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="normal" fill="#60666d"><tspan x="750" dy="0">通过且还有下一位：更新当前确认人</tspan></text><rect x="580" y="1090" width="340" height="100" rx="16" fill="white" stroke="#697582" stroke-width="1.6"/><text x="750" y="1122.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#263544"><tspan x="750" dy="0">正式版本已生效</tspan></text><path d="M580 1140 H920" fill="none" stroke="#c4c9ce"/><text x="750" y="1169.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="normal" fill="#60666d"><tspan x="750" dy="0">本次工作版本确认完成，保留历史</tspan></text><rect x="70" y="610" width="340" height="100" rx="16" fill="white" stroke="#697582" stroke-width="1.6"/><text x="240" y="642.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#263544"><tspan x="240" dy="0">已退回／待 AE 调整</tspan></text><path d="M70 660 H410" fill="none" stroke="#c4c9ce"/><text x="240" y="689.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="normal" fill="#60666d"><tspan x="240" dy="0">仅指定创建人可调整、保存、重新提交</tspan></text><rect x="1090" y="890" width="340" height="100" rx="16" fill="white" stroke="#697582" stroke-width="1.6"/><text x="1260" y="922.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold" fill="#263544"><tspan x="1260" dy="0">已退回／待 SCM 调整</tspan></text><path d="M1090 940 H1430" fill="none" stroke="#c4c9ce"/><text x="1260" y="969.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="normal" fill="#60666d"><tspan x="1260" dy="0">仅指定 SCM 可调整、保存、重新提交</tspan></text><circle cx="750" cy="1280" r="14" fill="white" stroke="#222" stroke-width="2"/><circle cx="750" cy="1280" r="9" fill="#111"/><polyline points="750,176 750,215" fill="none" stroke="#60666d" stroke-width="1.6" marker-end="url(#arrow)"/><polyline points="750,315 750,450" fill="none" stroke="#60666d" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="775.5" y="367" width="299" height="23" fill="white"/><text x="925" y="385.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="normal" fill="#60666d"><tspan x="925" dy="0">AE 提交 [包含 SCM，顺序有效]</tspan></text><polyline points="750,550 750,750" fill="none" stroke="#60666d" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="653.0" y="604" width="194" height="46" fill="white"/><text x="750" y="630.25" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="normal" fill="#60666d"><tspan x="750" dy="0">SCM 确认／编辑后提交</tspan><tspan x="750" dy="19.5">[存在其他确认人]</tspan></text><polyline points="750,850 750,1090" fill="none" stroke="#60666d" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="578.0" y="1042" width="344" height="23" fill="white"/><text x="750" y="1060.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="normal" fill="#60666d"><tspan x="750" dy="0">当前人员通过 [已是最后一位]／生成正式版本</tspan></text><polyline points="750,1190 750,1266" fill="none" stroke="#60666d" stroke-width="1.6" marker-end="url(#arrow)"/><rect 