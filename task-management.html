<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>阶段任务管理</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --surface: #ffffff;
      --muted: #f4f6f9;
      --line: #e4e8ef;
      --line-strong: #d7dee8;
      --text: #252a34;
      --secondary: #667085;
      --tertiary: #98a2b3;
      --primary: #1769ff;
      --primary-weak: #eaf2ff;
      --danger: #f04438;
      --danger-weak: #fff1f0;
      --success: #16a163;
      --success-weak: #e9f8f0;
      --warning: #f79009;
      --warning-weak: #fff6e6;
      --shadow: 0 18px 42px rgba(16, 24, 40, .12);
      --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.45;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: var(--surface);
    }

    .topbar {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .96);
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(8px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 17px;
      font-weight: 900;
    }

    .brand-mark {
      width: 4px;
      height: 28px;
      border-radius: 4px;
      background: var(--primary);
    }

    .stage-tabs {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .stage-tab {
      min-width: 76px;
      height: 34px;
      border: 1px solid transparent;
      border-radius: 5px;
      color: #344054;
      background: #f0f3f8;
      font-weight: 800;
      padding: 0 16px;
    }

    .stage-tab.active {
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 8px 16px rgba(23, 105, 255, .16);
    }

    .content {
      padding: 24px 26px 110px;
    }

    .stage-card {
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: #fff;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .stage-head {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 26px;
      background: #fbfcff;
      border-bottom: 1px solid var(--line);
    }

    .stage-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 900;
    }

    .stage-index {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--primary);
      font-weight: 900;
      font-size: 14px;
    }

    .stage-summary {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--secondary);
      font-weight: 800;
      font-size: 13px;
      margin-left: 10px;
    }

    .stage-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stage-toggle {
      border: 0;
      background: transparent;
      color: var(--primary);
      font-weight: 900;
    }

    .stage-body {
      padding: 24px 26px 26px;
    }

    .stage-card.collapsed .stage-body {
      display: none;
    }

    .form-grid {
      display: grid;
      grid-template-columns: minmax(390px, 460px);
      gap: 20px 42px;
      margin-bottom: 24px;
    }

    .form-grid .wide {
      grid-column: 1 / -1;
    }

    .field-row {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
    }

    .field-row label {
      text-align: right;
      color: #344054;
      font-weight: 850;
      white-space: nowrap;
    }

    .required::before {
      content: "*";
      color: var(--danger);
      margin-right: 2px;
    }

    .field,
    .task-input,
    .task-select,
    .library-filter input,
    .library-filter select {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      background: #fff;
      color: #344054;
      padding: 0 11px;
      font-weight: 650;
    }

    .task-select {
      appearance: none;
      max-width: 100%;
      padding-right: 30px;
      overflow: hidden;
      text-overflow: ellipsis;
      background-image:
        linear-gradient(45deg, transparent 50%, #667085 50%),
        linear-gradient(135deg, #667085 50%, transparent 50%);
      background-position:
        calc(100% - 16px) 50%,
        calc(100% - 11px) 50%;
      background-size:
        5px 5px,
        5px 5px;
      background-repeat: no-repeat;
    }

    .department-trigger {
      width: 100%;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      background: #fbfdff;
      color: #1f2937;
      padding: 0 10px;
      font-weight: 800;
      text-align: left;
      transition: .16s ease;
    }

    .type-trigger {
      gap: 9px;
    }

    .department-trigger:hover,
    .department-trigger.active,
    .type-trigger:hover,
    .type-trigger.active {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(23, 105, 255, .12);
    }

    .department-trigger-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .type-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #667085;
      flex: 0 0 auto;
    }

    .type-dot.critical {
      background: var(--danger);
    }

    .department-trigger::after {
      content: "";
      width: 7px;
      height: 7px;
      border-right: 1.8px solid #667085;
      border-bottom: 1.8px solid #667085;
      transform: rotate(45deg) translateY(-2px);
      flex: 0 0 auto;
    }

    .floating-select-menu {
      position: fixed;
      z-index: 90;
      width: 230px;
      max-height: 280px;
      overflow-y: auto;
      padding: 6px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 14px 36px rgba(16, 24, 40, .16);
    }

    .floating-select-menu[hidden] {
      display: none;
    }

    .floating-select-option {
      width: 100%;
      min-height: 34px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #344054;
      padding: 7px 9px;
      text-align: left;
      font-weight: 750;
      white-space: normal;
    }

    .floating-select-option:hover,
    .floating-select-option.active {
      color: var(--primary);
      background: var(--primary-weak);
    }

    .floating-select-option-content {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    textarea.field {
      min-height: 42px;
      padding-top: 9px;
      resize: vertical;
    }

    .field:focus,
    .task-input:focus,
    .task-select:focus,
    .library-filter input:focus,
    .library-filter select:focus {
      outline: 2px solid rgba(23, 105, 255, .16);
      border-color: var(--primary);
    }

    .is-invalid {
      border-color: var(--danger) !important;
      background: var(--danger-weak) !important;
    }

    .task-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      margin-bottom: 16px;
    }

    .task-section-head h2 {
      margin: 0;
      font-size: 17px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      background: #fff;
      color: #344054;
      padding: 0 14px;
      font-weight: 850;
      white-space: nowrap;
      transition: .16s ease;
    }

    .btn:hover {
      color: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 6px 16px rgba(23, 105, 255, .10);
    }

    .btn-primary {
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
    }

    .btn-primary:hover {
      color: #fff;
      filter: brightness(.98);
    }

    .btn-danger {
      color: #b42318;
      border-color: #fecdca;
      background: #fff;
    }

    .table-shell {
      border: 1px solid var(--line);
      overflow-x: auto;
      background: #fff;
    }

    table {
      width: 100%;
      min-width: 1490px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      height: 52px;
      border-bottom: 1px solid var(--line);
      padding: 0 10px;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #3d4451;
      font-weight: 650;
    }

    th {
      background: #f5f7fa;
      color: #344054;
      font-weight: 900;
    }

    .center {
      text-align: center;
    }

    .group-row td {
      min-height: 42px;
      padding: 6px 16px;
      background: #f6f7f9;
      color: var(--secondary);
      font-size: 12px;
      font-weight: 900;
    }

    .group-row-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .group-add-task {
      min-height: 28px;
      padding: 0 10px;
      border: 1px solid #cfe0ff;
      border-radius: 4px;
      background: #fff;
      color: var(--primary);
      font-size: 12px;
      font-weight: 850;
    }

    .group-add-task:hover {
      border-color: var(--primary);
      background: var(--primary-weak);
    }

    .title-cell {
      font-weight: 900;
      color: #2f3645;
    }

    .desc-cell {
      white-space: normal;
      line-height: 1.35;
    }

    .link-button {
      border: 0;
      background: transparent;
      color: var(--primary);
      padding: 4px 0;
      font-weight: 900;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 9px;
      border-radius: 5px;
      background: #eef2f6;
      color: #475467;
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }

    .tag-blue {
      color: var(--primary);
      background: var(--primary-weak);
    }

    .tag-orange {
      color: #b54708;
      background: var(--warning-weak);
    }

    .tag-green {
      color: var(--success);
      background: var(--success-weak);
    }

    .bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 18;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: rgba(255, 255, 255, .96);
      border-top: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(15, 23, 42, .38);
    }

    .modal-backdrop[hidden] {
      display: none;
    }

    .modal {
      width: min(1120px, 100%);
      max-height: min(88vh, 940px);
      display: grid;
      grid-template-rows: auto auto auto 1fr auto;
      overflow: hidden;
      border-radius: 7px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .modal-head,
    .modal-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
    }

    .modal-head h2 {
      margin: 0;
      font-size: 18px;
    }

    .close-button {
      width: 34px;
      height: 34px;
      border: 0;
      background: transparent;
      color: var(--tertiary);
      font-size: 30px;
      line-height: 1;
    }

    .library-filter {
      display: grid;
      grid-template-columns: 92px minmax(220px, 1fr) 90px minmax(220px, 1fr) auto auto;
      align-items: center;
      gap: 12px;
      padding: 18px 24px 10px;
    }

    .library-filter label {
      color: #475467;
      font-weight: 850;
    }

    .category-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      padding: 8px 24px 16px;
      border-bottom: 1px solid var(--line);
    }

    .category-tab {
      height: 34px;
      border: 0;
      border-radius: 5px;
      background: #f0f2f6;
      color: #344054;
      padding: 0 16px;
      font-weight: 850;
    }

    .category-tab.active {
      color: #fff;
      background: var(--primary);
    }

    .library-list {
      overflow-y: auto;
      display: grid;
      gap: 16px;
      padding: 20px 24px;
      background: #fff;
    }

    .library-card {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: #fff;
    }

    .library-card h3 {
      margin: 0 0 7px;
      color: #2f3645;
      font-size: 18px;
    }

    .library-card p {
      margin: 0;
      color: var(--secondary);
      line-height: 1.4;
    }

    .library-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .modal-foot {
      justify-content: flex-end;
      border-top: 1px solid var(--line);
      border-bottom: 0;
    }

    .task-type-modal {
      width: min(480px, 100%);
      grid-template-rows: auto 1fr auto;
    }

    .task-type-form {
      display: grid;
      gap: 8px;
      padding: 22px 24px;
    }

    .task-type-form label {
      color: #344054;
      font-weight: 850;
    }

    .task-type-form .field {
      width: 100%;
    }

    .task-type-error {
      min-height: 18px;
      margin: 0;
      color: var(--danger);
      font-size: 12px;
      font-weight: 700;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 86px;
      z-index: 70;
      transform: translateX(-50%);
      min-width: 260px;
      max-width: min(760px, calc(100vw - 32px));
      padding: 12px 16px;
      border: 1px solid #bfe8d2;
      border-radius: 6px;
      color: #067647;
      background: var(--success-weak);
      box-shadow: var(--shadow);
      text-align: center;
      font-weight: 850;
    }

    .toast.error {
      color: #b42318;
      border-color: #fecdca;
      background: var(--danger-weak);
    }

    .toast[hidden] {
      display: none;
    }

    @media (max-width: 980px) {
      .topbar {
        height: auto;
        min-height: 58px;
        padding: 14px;
        align-items: flex-start;
        flex-direction: column;
      }

      .stage-tabs {
        justify-content: flex-start;
      }

      .content {
        padding: 16px 12px 110px;
      }

      .stage-head,
      .task-section-head {
        align-items: flex-start;
        flex-direction: column;
        padding: 16px;
      }

      .stage-body {
        padding: 16px;
      }

      .form-grid,
      .library-filter {
        grid-template-columns: 1fr;
      }

      .field-row {
        grid-template-columns: 1fr;
      }

      .field-row label {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span>Stage Configuration</span>
      </div>
      <nav class="stage-tabs" id="stageTabs" aria-label="阶段快速切换"></nav>
    </header>

    <main class="content" id="stageList"></main>

    <footer class="bottom-bar">
      <button class="btn" type="button" id="backButton">返回</button>
      <button class="btn" type="button" id="resetAllButton">重置全部</button>
      <button class="btn btn-primary" type="button" id="submitButton">提交</button>
    </footer>
  </div>

  <div class="modal-backdrop" id="libraryModal" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="libraryTitle">
      <div class="modal-head">
        <h2 id="libraryTitle">子任务库</h2>
        <button class="close-button" type="button" id="closeLibrary" aria-label="关闭">×</button>
      </div>
      <div class="library-filter">
        <label for="libraryKeyword">K-PAC Title</label>
        <input id="libraryKeyword" type="search" placeholder="Please Input">
        <label for="libraryResponsible">Responsible</label>
        <select id="libraryResponsible">
          <option value="">Please Selected</option>
          <option>Sales</option>
          <option>PM</option>
          <option>AE</option>
          <option>SCM</option>
          <option>AQE</option>
          <option>SQD</option>
          <option>Finance</option>
          <option>MLT</option>
        </select>
        <button class="btn btn-primary" type="button" id="searchLibrary">查询</button>
        <button class="btn" type="button" id="resetLibrary">重置</button>
      </div>
      <div class="category-tabs" id="categoryTabs"></div>
      <div class="library-list" id="libraryList"></div>
      <div class="modal-foot">
        <button class="btn" type="button" id="cancelLibrary">取消</button>
        <button class="btn btn-primary" type="button" id="confirmLibrary">确定</button>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="taskTypeModal" hidden>
    <section class="modal task-type-modal" role="dialog" aria-modal="true" aria-labelledby="taskTypeTitle">
      <div class="modal-head">
        <h2 id="taskTypeTitle">新增任务类型</h2>
        <button class="close-button" type="button" data-close-task-type aria-label="关闭">×</button>
      </div>
      <form class="task-type-form" id="taskTypeForm">
        <label for="taskTypeName" class="required">任务类型名称</label>
        <input class="field" id="taskTypeName" type="text" maxlength="60" placeholder="请输入任务类型名称" autocomplete="off">
        <p class="task-type-error" id="taskTypeError" hidden></p>
      </form>
      <div class="modal-foot">
        <button class="btn" type="button" data-close-task-type>取消</button>
        <button class="btn btn-primary" type="button" id="confirmTaskType">确定新增</button>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" hidden></div>
  <div class="floating-select-menu" id="departmentMenu" hidden></div>

  <script src="data/gate_tasks_split.ui.js"></script>
  <script>

      {

        category: "Product Design and Development",
        ownerRole: "AE",
        version: "V1",
        deliverable: "BOM Draft",
        critical: true
      },
      {
        id: "GPM_SCM-04",
        title: "SCM BOM Review",
        description: "SCM reviews sourcing feasibility, supplier readiness and purchasing assumptions in the BOM.",
        category: "Supply Chain Definition",
        ownerRole: "SCM",
        version: "V1",
        deliverable: "BOM Review",
        critical: false
      },
      {
        id: "GPM_AQE-03",
        title: "Assembly APQP Plan",
        description: "PM creates assembly APQP based on confirmed BOM, AQE decomposes sub-assembly and child part development tasks.",
        category: "Quality Plan",
        ownerRole: "AQE",
        version: "V2",
        deliverable: "APQP Plan",
        critical: true
      },
      {
        id: "GPM_SQD-07",
        title: "Supplier Child Part Development",
        description: "SQD aligns child part development plan with suppliers and synchronizes key milestones.",
        category: "Process Design and Development",
        ownerRole: "SQD",
        version: "V1",
        deliverable: "Supplier Plan",
        critical: false
      }
    ];

    function addDays(dateValue, days) {
      const date = new Date(`${dateValue}T00:00:00`);
      date.setDate(date.getDate() + days);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    let taskLibrary = fallbackTaskLibrary;
    let defaultStageConfigs = [];
    let stageConfigs = [];

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function mapSourceTask(item, index = 0) {
      return {
        uid: item.taskId || `${item.uiStage || "task"}-${item.kpacId || item.id || index}-${index}`,
        id: item.kpacId || item.id || "",
        title: item.title || "",
        description: item.taskDescription || item.description || "",
        category: item.function || item.category || "Plan and Define",
        ownerRole: item.responsible || item.ownerRole || "",
        version: item.version || "",
        deliverable: item.documentOrEvidence || item.deliverable || "",
        critical: item.requiredType ? item.requiredType === "required" : Boolean(item.critical),
        start: "",
        end: "",
        source: "library",
        sourceStage: item.originalStage || item.stage || "",
        remarks: item.remarks || ""
      };
    }

    function buildStageConfigs(tasks = taskLibrary) {
      return stageNames.map((name, index) => {
        const stageEnd = addDays(stageEndBaseDate, index * 15);
        return {
          name,
          end: stageEnd,
          collapsed: index !== 0,
          tasks: tasks
            .filter((task) => (task.uiStage || task.stage) === name)
            .map((task, taskIndex) => {
              const mapped = mapSourceTask(task, taskIndex);
              return {
                ...mapped,
                uid: `${name}-${mapped.uid}`,
                end: mapped.critical ? stageEnd : ""
              };
            })
        };
      });
    }

    function buildFallbackStageConfigs() {
      return stageNames.map((name, index) => {
        const stageEnd = addDays(stageEndBaseDate, index * 15);
        return {
          name,
          end: stageEnd,
          collapsed: index !== 0,
          tasks: index === 0
            ? fallbackTaskLibrary.slice(0, 6).map((task, taskIndex) => ({
              uid: `${name}-${task.id}-${taskIndex}`,
              ...task,
              start: "",
              end: task.critical ? stageEnd : "",
              source: "library"
            }))
            : []
        };
      });
    }

    const stageList = document.getElementById("stageList");
    const stageTabs = document.getElementById("stageTabs");
    const libraryModal = document.getElementById("libraryModal");
    const taskTypeModal = document.getElementById("taskTypeModal");
    const taskTypeForm = document.getElementById("taskTypeForm");
    const taskTypeName = document.getElementById("taskTypeName");
    const taskTypeError = document.getElementById("taskTypeError");
    const libraryKeyword = document.getElementById("libraryKeyword");
    const libraryResponsible = document.getElementById("libraryResponsible");
    const categoryTabs = document.getElementById("categoryTabs");
    const libraryList = document.getElementById("libraryList");
    const toast = document.getElementById("toast");
    const departmentMenu = document.getElementById("departmentMenu");
    let currentStageName = "CKO";
    let libraryStageName = "CKO";
    let taskTypeStageName = "CKO";
    let currentCategory = "All";
    let activeFloatingButton = null;
    let toastTimer;

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function showToast(message, isError = false) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.toggle("error", isError);
      toast.hidden = false;
      toastTimer = setTimeout(() => {
        toast.hidden = true;
      }, 2800);
    }

    function getStage(name) {
      return stageConfigs.find((stage) => stage.name === name);
    }

    function setActiveStage(name = stageConfigs[0]?.name || "") {
      currentStageName = stageConfigs.some((stage) => stage.name === name) ? name : (stageConfigs[0]?.name || "");
      if (!stageConfigs.some((stage) => stage.name === libraryStageName)) {
        libraryStageName = currentStageName;
      }
    }

    function getDepartmentOptions(value = "") {
      const departments = [...new Set([
        ...taskLibrary.map((task) => mapSourceTask(task).ownerRole),
        ...stageConfigs.flatMap((stage) => stage.tasks.map((task) => task.ownerRole)),
        "PM"
      ].filter(Boolean))].sort((a, b) => a.localeCompare(b));
      if (value && !departments.includes(value)) departments.unshift(value);
      return departments;
    }

    function renderDepartmentButton(task) {
      const value = task.ownerRole || "";
      return `
        <button class="department-trigger" type="button" title="${escapeHtml(value)}" data-department-trigger>
          <span class="department-trigger-text">${escapeHtml(value || "请选择")}</span>
        </button>
      `;
    }

    function getTaskTypeLabel(isCritical) {
      return isCritical ? "关键任务" : "普通任务";
    }

    function renderTypeButton(task) {
      const label = getTaskTypeLabel(task.critical);
      return `
        <button class="department-trigger type-trigger" type="button" title="${label}" data-type-trigger>
          <span class="type-dot ${task.critical ? "critical" : ""}"></span>
          <span class="department-trigger-text">${label}</span>
        </button>
      `;
    }

    function renderTabs() {
      stageTabs.innerHTML = stageConfigs.map((stage) => `
        <button class="stage-tab ${stage.name === currentStageName ? "active" : ""}" type="button" data-jump="${stage.name}">${stage.name}</button>
      `).join("");
    }

    function renderStages() {
      setActiveStage(currentStageName);
      renderTabs();
      if (!stageConfigs.length) {
        stageList.innerHTML = `
          <section class="stage-card">
            <header class="stage-head">
              <div class="stage-title">
                <span>暂无阶段</span>
                <span class="stage-summary"><span>可通过重置全部恢复默认阶段</span></span>
              </div>
            </header>
          </section>
        `;
        return;
      }

      stageList.innerHTML = stageConfigs.map((stage, index) => {
        const criticalCount = stage.tasks.filter((task) => task.critical).length;
        const stageCategories = [...new Set([
          ...categories.filter((category) => category !== "All"),
          ...(stage.customCategories || [])
        ])];
        const groupedTasks = stageCategories.map((category) => {
          const tasks = stage.tasks.filter((task) => task.category === category);
          const isCustomCategory = (stage.customCategories || []).includes(category);
          if (!tasks.length && !isCustomCategory) return "";

          return `
            <tr class="group-row"><td colspan="11"><div class="group-row-content"><span>${escapeHtml(category)}</span><button class="group-add-task" type="button" data-add-task="${escapeHtml(stage.name)}" data-task-category="${escapeHtml(category)}">新增任务</button></div></td></tr>
            ${tasks.length ? tasks.map((task, taskIndex) => `
              <tr data-row="${task.uid}" data-stage="${stage.name}">
                <td class="center"><input type="checkbox" data-row-check></td>
                <td class="center">${taskIndex + 1}</td>
                <td>${escapeHtml(task.id)}</td>
                <td class="title-cell">${task.source === "manual"
                  ? `<input class="task-input" type="text" value="${escapeHtml(task.title)}" data-task-field="title">`
                  : escapeHtml(task.title)}
                </td>
                <td class="desc-cell">${task.source === "manual"
                  ? `<input class="task-input" type="text" value="${escapeHtml(task.description || "")}" data-task-field="description">`
                  : escapeHtml(task.description || "-")}
                </td>
                <td>${renderDepartmentButton(task)}</td>
                <td>${renderTypeButton(task)}</td>
                <td><input class="task-input" type="date" value="${task.start}" data-task-field="start"></td>
                <td><input class="task-input" type="date" value="${task.end}" data-task-field="end"></td>
                <td>${task.source === "manual" ? "手动新增" : "子任务库"}</td>
                <td><button class="link-button" type="button" data-delete>删除</button></td>
              </tr>
            `).join("") : `<tr><td colspan="11" class="center">暂无任务，点击“新增任务”创建。</td></tr>`}
          `;
        }).join("");

        return `
          <article class="stage-card ${stage.collapsed ? "collapsed" : ""}" id="stage-${stage.name}" data-stage-card="${stage.name}">
            <header class="stage-head">
              <div class="stage-title">
                <span class="stage-index">${index + 1}</span>
                <span>${stage.name}</span>
                <span class="stage-summary">
                  <span>${stage.tasks.length} 个任务</span>
                  <span>${criticalCount} 个关键任务</span>
                </span>
              </div>
              <div class="stage-actions">
                <button class="btn" type="button" data-reset-stage="${stage.name}">重置阶段</button>
                <button class="btn btn-danger" type="button" data-delete-stage="${stage.name}">删除阶段</button>
                <button class="stage-toggle" type="button" data-toggle="${stage.name}">${stage.collapsed ? "展开" : "收起"}</button>
              </div>
            </header>
            <div class="stage-body">
              <div class="form-grid">
                <div class="field-row">
                  <label class="required">阶段计划结束日期</label>
                  <input class="field" type="date" value="${stage.end}" data-stage-field="end" data-stage-name="${stage.name}">
                </div>
              </div>

              <div class="task-section-head">
                <h2>任务清单</h2>
                <div class="toolbar">
                  <button class="btn btn-primary" type="button" data-open-library="${stage.name}">子任务库</button>
                  <button class="btn" type="button" data-add-task-type="${stage.name}">新增任务类型</button>
                  <button class="btn btn-danger" type="button" data-bulk-delete="${stage.name}">批量移除</button>
                </div>
              </div>

              <div class="table-shell">
                <table aria-label="${stage.name}任务清单">
                  <colgroup>
                    <col style="width:48px">
                    <col style="width:58px">
                    <col style="width:130px">
                    <col style="width:360px">
                    <col style="width:350px">
                    <col style="width:130px">
                    <col style="width:180px">
                    <col style="width:150px">
                    <col style="width:150px">
                    <col style="width:96px">
                    <col style="width:88px">
                  </colgroup>
                  <thead>
                    <tr>
                      <th class="center"><input type="checkbox" data-select-all="${stage.name}"></th>
                      <th class="center">序号</th>
                      <th>K-PAC 编号</th>
                      <th>K-PAC 标题</th>
                      <th>任务描述</th>
                      <th>负责部门</th>
                      <th>任务类型</th>
                      <th>开始时间</th>
                      <th>结束时间</th>
                      <th>来源</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${stage.tasks.length ? groupedTasks : `<tr><td colspan="11" class="center">暂无任务，可通过子任务库添加或手动新增</td></tr>`}
                  </tbody>
                </table>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    function updateStageField(control) {
      const stage = getStage(control.dataset.stageName);
      stage[control.dataset.stageField] = control.value;
      control.classList.remove("is-invalid");
    }

    function updateTaskField(control) {
      const row = control.closest("[data-row]");
      const stage = getStage(row.dataset.stage);
      const task = stage.tasks.find((item) => item.uid === row.dataset.row);
      if (control.dataset.taskField === "critical") {
        task.critical = control.value === "critical";
        control.classList.toggle("critical", task.critical);
      } else {
        task[control.dataset.taskField] = control.value;
        if (control.dataset.taskField === "ownerRole") control.title = control.value;
      }
      control.classList.remove("is-invalid");
    }

    function closeFloatingMenu() {
      departmentMenu.hidden = true;
      activeFloatingButton?.classList.remove("active");
      activeFloatingButton = null;
    }

    function openDepartmentMenu(button) {
      const row = button.closest("[data-row]");
      const stage = getStage(row.dataset.stage);
      const task = stage.tasks.find((item) => item.uid === row.dataset.row);
      activeFloatingButton?.classList.remove("active");
      activeFloatingButton = button;
      button.classList.add("active");

      departmentMenu.innerHTML = getDepartmentOptions(task.ownerRole).map((department) => `
        <button
          class="floating-select-option ${department === task.ownerRole ? "active" : ""}"
          type="button"
          data-department-option="${escapeHtml(department)}"
        >${escapeHtml(department)}</button>
      `).join("");

      positionFloatingMenu(button);
    }

    function openTypeMenu(button) {
      const row = button.closest("[data-row]");
      const stage = getStage(row.dataset.stage);
      const task = stage.tasks.find((item) => item.uid === row.dataset.row);
      activeFloatingButton?.classList.remove("active");
      activeFloatingButton = button;
      button.classList.add("active");

      const options = [
        { value: "critical", label: getTaskTypeLabel(true), critical: true },
        { value: "regular", label: getTaskTypeLabel(false), critical: false }
      ];
      departmentMenu.innerHTML = options.map((option) => `
        <button
          class="floating-select-option ${option.critical === task.critical ? "active" : ""}"
          type="button"
          data-type-option="${option.value}"
        >
          <span class="floating-select-option-content">
            <span class="type-dot ${option.critical ? "critical" : ""}"></span>
            <span>${option.label}</span>
          </span>
        </button>
      `).join("");

      positionFloatingMenu(button);
    }

    function positionFloatingMenu(button) {
      const rect = button.getBoundingClientRect();
      const menuWidth = Math.max(180, rect.width);
      departmentMenu.style.width = `${menuWidth}px`;
      departmentMenu.style.left = `${Math.min(rect.left, window.innerWidth - menuWidth - 12)}px`;
      departmentMenu.style.top = `${Math.min(rect.bottom + 6, window.innerHeight - 292)}px`;
      departmentMenu.hidden = false;
    }

    function selectDepartment(value) {
      if (!activeFloatingButton) return;
      const row = activeFloatingButton.closest("[data-row]");
      const stage = getStage(row.dataset.stage);
      const task = stage.tasks.find((item) => item.uid === row.dataset.row);
      task.ownerRole = value;
      activeFloatingButton.title = value;
      activeFloatingButton.querySelector(".department-trigger-text").textContent = value;
      closeFloatingMenu();
    }

    function selectTaskType(value) {
      if (!activeFloatingButton) return;
      const row = activeFloatingButton.closest("[data-row]");
      const stage = getStage(row.dataset.stage);
      const task = stage.tasks.find((item) => item.uid === row.dataset.row);
      task.critical = value === "critical";
      activeFloatingButton.title = getTaskTypeLabel(task.critical);
      activeFloatingButton.querySelector(".department-trigger-text").textContent = activeFloatingButton.title;
      activeFloatingButton.querySelector(".type-dot").classList.toggle("critical", task.critical);
      closeFloatingMenu();
    }

    function addManualTask(stageName, category) {
      const stage = getStage(stageName);
      const next = stage.tasks.length + 1;
      stage.tasks.push({
        uid: `${stageName}-manual-${Date.now()}`,
        id: `MANUAL-${String(next).padStart(2, "0")}`,
        title: "手动新增任务",
        description: "请补充任务执行要求",
        category: category || "Plan and Define",
        ownerRole: "PM",
        version: "V1",
        deliverable: "",
        critical: false,
        owner: "",
        start: "",
        end: "",
        source: "manual"
      });
      stage.collapsed = false;
      currentStageName = stageName;
      renderStages();
      showToast("已新增手动任务，请补充任务信息。");
    }

    function showTaskTypeModal(stageName) {
      taskTypeStageName = stageName;
      taskTypeForm.reset();
      taskTypeError.hidden = true;
      taskTypeModal.hidden = false;
      taskTypeName.focus();
    }

    function hideTaskTypeModal() {
      taskTypeModal.hidden = true;
      taskTypeError.hidden = true;
    }

    function confirmTaskType() {
      const stage = getStage(taskTypeStageName);
      const name = taskTypeName.value.trim();
      const existing = new Set([
        ...categories.filter((category) => category !== "All"),
        ...(stage?.customCategories || [])
      ].map((category) => category.toLocaleLowerCase("zh-CN")));
      if (!name) {
        taskTypeError.textContent = "请输入任务类型名称。";
        taskTypeError.hidden = false;
        taskTypeName.focus();
        return;
      }
      if (existing.has(name.toLocaleLowerCase("zh-CN"))) {
        taskTypeError.textContent = "该任务类型已存在，请输入其他名称。";
        taskTypeError.hidden = false;
        taskTypeName.focus();
        return;
      }
      stage.customCategories = [...(stage.customCategories || []), name];
      stage.collapsed = false;
      currentStageName = stage.name;
      hideTaskTypeModal();
      renderStages();
      showToast(`已新增任务类型“${name}”。`);
    }

    function resetStage(stageName) {
      const index = stageConfigs.findIndex((stage) => stage.name === stageName);
      const source = defaultStageConfigs.find((stage) => stage.name === stageName);
      if (!source) {
        showToast("未找到该阶段的默认配置，请使用重置全部恢复。", true);
        return;
      }
      const nextStage = clone(source);
      nextStage.collapsed = false;
      if (index >= 0) {
        stageConfigs.splice(index, 1, nextStage);
      } else {
        const defaultIndex = defaultStageConfigs.findIndex((stage) => stage.name === stageName);
        const insertAt = stageConfigs.findIndex((stage) => defaultStageConfigs.findIndex((item) => item.name === stage.name) > defaultIndex);
        stageConfigs.splice(insertAt === -1 ? stageConfigs.length : insertAt, 0, nextStage);
      }
      setActiveStage(stageName);
      renderStages();
      showToast(`${stageName} 已恢复为默认任务。`);
    }

    function deleteStage(stageName) {
      if (!confirm(`确定删除 ${stageName} 阶段及其全部任务吗？可通过“重置全部”恢复。`)) return;
      stageConfigs = stageConfigs.filter((stage) => stage.name !== stageName);
      setActiveStage(stageConfigs[0]?.name);
      renderStages();
      showToast(`${stageName} 阶段已删除。`);
    }

    function resetAllStages() {
      stageConfigs = clone(defaultStageConfigs);
      setActiveStage("CKO");
      renderStages();
      showToast("已恢复全部默认阶段和任务。");
    }

    function deleteTask(stageName, uid) {
      const stage = getStage(stageName);
      stage.tasks = stage.tasks.filter((task) => task.uid !== uid);
      renderStages();
      showToast("任务已删除。");
    }

    function bulkDelete(stageName) {
      const checked = Array.from(document.querySelectorAll(`[data-stage="${stageName}"] [data-row-check]:checked`)).map((item) => item.closest("[data-row]").dataset.row);
      if (!checked.length) {
        showToast("请先勾选需要移除的任务。", true);
        return;
      }
      const stage = getStage(stageName);
      stage.tasks = stage.tasks.filter((task) => !checked.includes(task.uid));
      renderStages();
      showToast(`已移除 ${checked.length} 个任务。`);
    }

    function renderCategories() {
      categoryTabs.innerHTML = categories.map((category) => `
        <button class="category-tab ${category === currentCategory ? "active" : ""}" type="button" data-category="${category}">${category}</button>
      `).join("");
    }

    function renderLibrary() {
      renderCategories();
      const keyword = libraryKeyword.value.trim().toLowerCase();
      const responsible = libraryResponsible.value;
      const existing = new Set((getStage(libraryStageName)?.tasks || []).map((task) => task.id));
      const items = taskLibrary.filter((task) => {
        const mapped = mapSourceTask(task);
        const matchStage = (task.uiStage || task.stage || libraryStageName) === libraryStageName;
        const matchCategory = currentCategory === "All" || mapped.category === currentCategory;
        const matchKeyword = !keyword || mapped.title.toLowerCase().includes(keyword) || mapped.id.toLowerCase().includes(keyword);
        const matchResponsible = !responsible || mapped.ownerRole === responsible;
        return matchStage && matchCategory && matchKeyword && matchResponsible;
      });

      libraryList.innerHTML = items.length ? items.map((sourceTask) => {
        const task = mapSourceTask(sourceTask);
        return `
        <article class="library-card">
          <input type="checkbox" value="${task.id}" ${existing.has(task.id) ? "checked" : ""} data-library-check>
          <div>
            <h3>${escapeHtml(task.title)}</h3>
            <p>${escapeHtml(task.description || "Without description")}</p>
            <div class="library-tags">
              <span class="tag">ID: ${escapeHtml(task.id)}</span>
              <span class="tag">${escapeHtml(task.version)}</span>
              <span class="tag tag-blue">${escapeHtml(task.category)}</span>
              ${task.deliverable ? `<span class="tag">${escapeHtml(task.deliverable)}</span>` : ""}
              <span class="tag">${escapeHtml(task.ownerRole)}</span>
              <span class="tag ${task.critical ? "tag-orange" : ""}">${task.critical ? "关键任务" : "普通任务"}</span>
            </div>
          </div>
        </article>
        `;
      }).join("") : `<div class="library-card"><div></div><div><h3>没有匹配任务</h3><p>调整筛选条件后再试。</p></div></div>`;
    }

    function openLibrary(stageName) {
      libraryStageName = stageName;
      currentCategory = "All";
      libraryKeyword.value = "";
      libraryResponsible.value = "";
      libraryModal.hidden = false;
      renderLibrary();
    }

    function closeLibrary() {
      libraryModal.hidden = true;
    }

    function confirmLibrary() {
      const selectedIds = Array.from(document.querySelectorAll("[data-library-check]:checked")).map((item) => item.value);
      const stage = getStage(libraryStageName);
      const existing = new Set(stage.tasks.map((task) => task.id));
      let added = 0;
      selectedIds.forEach((id) => {
        if (existing.has(id)) return;
        const source = taskLibrary.find((task) => {
          const mapped = mapSourceTask(task);
          return mapped.id === id && (task.uiStage || task.stage || libraryStageName) === libraryStageName;
        });
        if (!source) return;
        const mapped = mapSourceTask(source);
        stage.tasks.push({
          ...mapped,
          uid: `${libraryStageName}-${mapped.uid}-${Date.now()}-${Math.random().toString(16).slice(2)}`,
          start: "",
          end: mapped.critical ? stage.end : "",
          source: "library"
        });
        added += 1;
      });
      stage.collapsed = false;
      currentStageName = libraryStageName;
      closeLibrary();
      renderStages();
      showToast(added ? `已添加 ${added} 个子任务。` : "已保留当前选择，未新增重复任务。");
    }

    function validateConfig() {
      let valid = true;
      const messages = [];
      document.querySelectorAll(".is-invalid").forEach((item) => item.classList.remove("is-invalid"));

      stageConfigs.forEach((stage) => {
        const card = document.querySelector(`[data-stage-card="${stage.name}"]`);
        if (!stage.end) {
          valid = false;
          messages.push(`${stage.name} 的阶段计划结束日期必填`);
          stage.collapsed = false;
          card?.classList.remove("collapsed");
          card?.querySelectorAll("[data-stage-field]").forEach((field) => {
            if (!field.value) field.classList.add("is-invalid");
          });
        }
        stage.tasks.forEach((task) => {
          const row = document.querySelector(`[data-row="${task.uid}"]`);
          if (task.critical && !task.end) {
            valid = false;
            messages.push(`${stage.name} 关键任务「${task.title}」必须填写结束时间`);
            stage.collapsed = false;
            card?.classList.remove("collapsed");
            row?.querySelector('[data-task-field="end"]')?.classList.add("is-invalid");
          }
          if (task.start && task.end && task.start > task.end) {
            valid = false;
            messages.push(`${stage.name} 任务「${task.title}」开始时间不能晚于结束时间`);
            row?.querySelector('[data-task-field="start"]')?.classList.add("is-invalid");
            row?.querySelector('[data-task-field="end"]')?.classList.add("is-invalid");
          }
        });
      });

      if (!valid) {
        showToast([...new Set(messages)].slice(0, 3).join("；"), true);
      }
      return valid;
    }

    stageList.addEventListener("click", (event) => {
      const toggle = event.target.closest("[data-toggle]");
      const openButton = event.target.closest("[data-open-library]");
      const addTaskTypeButton = event.target.closest("[data-add-task-type]");
      const addTaskButton = event.target.closest("[data-add-task]");
      const deleteButton = event.target.closest("[data-delete]");
      const bulkButton = event.target.closest("[data-bulk-delete]");
      const resetStageButton = event.target.closest("[data-reset-stage]");
      const deleteStageButton = event.target.closest("[data-delete-stage]");
      const departmentTrigger = event.target.closest("[data-department-trigger]");
      const typeTrigger = event.target.closest("[data-type-trigger]");

      if (toggle) {
        const stage = getStage(toggle.dataset.toggle);
        stage.collapsed = !stage.collapsed;
        currentStageName = stage.name;
        renderStages();
      }
      if (openButton) openLibrary(openButton.dataset.openLibrary);
      if (addTaskTypeButton) showTaskTypeModal(addTaskTypeButton.dataset.addTaskType);
      if (addTaskButton) addManualTask(addTaskButton.dataset.addTask, addTaskButton.dataset.taskCategory);
      if (bulkButton) bulkDelete(bulkButton.dataset.bulkDelete);
      if (resetStageButton) resetStage(resetStageButton.dataset.resetStage);
      if (deleteStageButton) deleteStage(deleteStageButton.dataset.deleteStage);
      if (departmentTrigger) openDepartmentMenu(departmentTrigger);
      if (typeTrigger) openTypeMenu(typeTrigger);
      if (deleteButton) {
        const row = deleteButton.closest("[data-row]");
        deleteTask(row.dataset.stage, row.dataset.row);
      }
    });

    departmentMenu.addEventListener("click", (event) => {
      const departmentOption = event.target.closest("[data-department-option]");
      const typeOption = event.target.closest("[data-type-option]");
      if (departmentOption) selectDepartment(departmentOption.dataset.departmentOption);
      if (typeOption) selectTaskType(typeOption.dataset.typeOption);
    });

    document.addEventListener("click", (event) => {
      if (event.target.closest("[data-department-trigger]") || event.target.closest("[data-type-trigger]") || event.target.closest("#departmentMenu")) return;
      closeFloatingMenu();
    });

    window.addEventListener("scroll", closeFloatingMenu, true);
    window.addEventListener("resize", closeFloatingMenu);

    stageList.addEventListener("input", (event) => {
      if (event.target.matches("[data-stage-field]")) updateStageField(event.target);
      if (event.target.matches("[data-task-field]")) updateTaskField(event.target);
    });

    stageList.addEventListener("change", (event) => {
      const selectAll = event.target.closest("[data-select-all]");
      if (selectAll) {
        document.querySelectorAll(`[data-stage="${selectAll.dataset.selectAll}"] [data-row-check]`).forEach((box) => {
          box.checked = selectAll.checked;
        });
      }
    });

    stageTabs.addEventListener("click", (event) => {
      const button = event.target.closest("[data-jump]");
      if (!button) return;
      const stage = getStage(button.dataset.jump);
      stage.collapsed = false;
      currentStageName = stage.name;
      renderStages();
      document.getElementById(`stage-${stage.name}`).scrollIntoView({ behavior: "smooth", block: "start" });
    });

    categoryTabs.addEventListener("click", (event) => {
      const button = event.target.closest("[data-category]");
      if (!button) return;
      currentCategory = button.dataset.category;
      renderLibrary();
    });

    document.getElementById("searchLibrary").addEventListener("click", renderLibrary);
    document.getElementById("resetLibrary").addEventListener("click", () => {
      libraryKeyword.value = "";
      libraryResponsible.value = "";
      currentCategory = "All";
      renderLibrary();
    });
    document.getElementById("closeLibrary").addEventListener("click", closeLibrary);
    document.getElementById("cancelLibrary").addEventListener("click", closeLibrary);
    document.getElementById("confirmLibrary").addEventListener("click", confirmLibrary);
    libraryModal.addEventListener("click", (event) => {
      if (event.target === libraryModal) closeLibrary();
    });

    document.querySelectorAll("[data-close-task-type]").forEach((button) => button.addEventListener("click", hideTaskTypeModal));
    document.getElementById("confirmTaskType").addEventListener("click", confirmTaskType);
    taskTypeForm.addEventListener("submit", (event) => {
      event.preventDefault();
      confirmTaskType();
    });
    taskTypeName.addEventListener("input", () => {
      taskTypeError.hidden = true;
    });
    taskTypeModal.addEventListener("click", (event) => {
      if (event.target === taskTypeModal) hideTaskTypeModal();
    });

    document.getElementById("submitButton").addEventListener("click", () => {
      if (validateConfig()) showToast("提交成功，阶段时间与任务配置已通过校验。");
    });

    document.getElementById("resetAllButton").addEventListener("click", resetAllStages);

    document.getElementById("backButton").addEventListener("click", () => {
      showToast("已返回上一页。静态原型中保留当前配置。");
    });

    async function loadTaskData() {
      try {
        let records = Array.isArray(window.GATE_TASKS_SPLIT_UI) ? window.GATE_TASKS_SPLIT_UI : null;
        if (!records) {
          const response = await fetch("data/gate_tasks_split.ui.json");
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          records = await response.json();
        }
        taskLibrary = records;
        defaultStageConfigs = buildStageConfigs(records);
        stageConfigs = clone(defaultStageConfigs);
        setActiveStage("CKO");
        renderStages();
        showToast(`已加载 ${records.length} 条真实任务数据。`);
      } catch (error) {
        console.warn("Failed to load task data, using fallback records.", error);
        taskLibrary = fallbackTaskLibrary;
        defaultStageConfigs = buildFallbackStageConfigs();
        stageConfigs = clone(defaultStageConfigs);
        setActiveStage("CKO");
        renderStages();
        showToast("未能加载 data/gate_tasks_split.ui.json，已使用内置示例数据。", true);
      }
    }

    loadTaskData();
  </script>
</body>
</html>
