<!doctype html>
<html lang="zh-CN">

  <style>

    @media(max-width:560px){.filters,.editor-head{grid-template-columns:1fr}.overview-title{display:none}.metric{min-width:118px}.field.version,.field.status,.field.grow{width:100%}.detail-meta,.confirm-grid{grid-template-columns:1fr}.role-box{width:100%;justify-content:space-between}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>

<body>
  <main class="app">
    <header class="page-head">
      <div>
        <h1>生产 BOM 管理</h1>
        <p>来源 BOM 已确认并锁定；进入本模块后按项目或零件 APQP 整体维护生产 BOM 版本。</p>
      </div>
      <label class="role-box">当前角色
        <select id="roleSelect" aria-label="当前角色">
          <option value="AE">Li Ming · AE</option>
          <option value="SCM">Chen Wei · SCM</option>
          <option value="ME">Zhou Lin · ME</option>
        </select>
      </label>
    </header>

    <section class="panel">
      <nav class="tabs" aria-label="BOM 来源分类">
        <button class="tab active" type="button" data-tab="项目开发">项目开发 BOM</button>
        <button class="tab" type="button" data-tab="零件 APQP">零件 APQP BOM</button>
      </nav>
      <div class="overview" id="overview" aria-label="生产 BOM 状态概览"></div>
      <div class="filters">
        <input class="input" id="numberFilter" placeholder="项目 / APQP 编号" aria-label="项目或 APQP 编号">
        <input class="input" id="nameFilter" placeholder="名称 / 客户" aria-label="名称或客户">
        <input class="input" id="keywordFilter" placeholder="L1 总成编号或名称" aria-label="L1 总成编号或名称">
        <select class="select" id="versionFilter" aria-label="版本状态">
          <option value="">全部版本状态</option>
          <option>当前生效版本</option><option>当前工作版本</option><option>待 SCM/ME 确认</option><option>已退回</option>
        </select>
        <button class="btn primary" id="queryBtn" type="button">查询</button>
        <button class="btn" id="resetBtn" type="button">重置</button>
      </div>
      <div class="table-wrap">
        <table class="main-table">
          <thead id="listHead"></thead>
          <tbody id="listRows"></tbody>
        </table>
      </div>
      <div class="footer-row"><span id="listCount"></span><span>版本以项目或零件 APQP 对象整体维护；L1 总成不在本模块独立升版。</span></div>
    </section>
  </main>

  <div class="modal-layer" id="modalLayer" hidden>
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><h2 id="modalTitle"></h2><button class="close" id="modalClose" aria-label="关闭弹窗">×</button></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

    function openModal(title,body,foot='',size='wide'){
      modalTitle.textContent=title;modalBody.innerHTML=body;modalFoot.innerHTML=foot;modal.className=`modal ${size}`;modalLayer.hidden=false;document.body.style.overflow='hidden';setTimeout(()=>modalClose.focus(),0);

    function closeModal(){modalLayer.hidden=true;document.body.style.overflow='';editing=null;pendingAction=null}
    function toastMessage(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toast._timer);toast._timer=setTimeout(()=>toast.classList.remove('show'),2400)}
    function flatLines(version,l1Filter='all'){return version.l1s.filter(l1=>l1Filter==='all'||l1.no===l1Filter).flatMap(l1=>l1.lines.map(row=>({...row,l1No:l1.no,l1Name:l1.name})));}

      return flatLines(version,l1Filter).map((row,index)=>`<tr><td>${index+1}</td><td>${esc(row.l1No)}</td><td><span class="level level-${Math.min(row.level,3)}">L${row.level}</span></td><td class="tree"><span class="indent" style="--level:${row.level}"></span>${esc(row.name)}<span class="sub">${esc(row.no)}</span></td><td>${esc(row.parent)}</td><td>${esc(row.qty)}</td>${compact?'':`<td>${esc(row.application)}</td><td>${esc(row.drawing)}</td><td>${esc(row.sampleSap)}</td><td>${esc(row.massSap)}</td><td>${esc(row.rawNo)}</td>`}<td>${esc(row.supplier)}</td><td>${statusTag(row.change||'无变更')}</td></tr>`).join('');
    }
    function detailTable(version,l1Filter='all',compact=false){return `<div class="table-wrap"><table class="${compact?'approval-table':'detail-table'}"><thead><tr><th>序号</th><th>所属 L1</th><th>层级</th><th>零件 / 材料名称</th><th>父级零件</th><th>数量</th>${compact?'':'<th>产品应用</th><th>图纸版本</th><th>样件 SAP 零件号</th><th>量产 SAP 零件号</th><th>原材料零件号</th>'}<th>供应商</th><th>变更状态</th></tr></thead><tbody>${lineRows(version,l1Filter,compact)}</tbody></table></div>`}
    function showDetail(bom,versionNo){
      currentBom=bom;currentVersion=bom.versions.find(item=>item.no===versionNo)||latest(bom);currentL1='all';
      openModal(`${bom.name} · 生产 BOM`,detailMarkup(bom,currentVersion),`<button class="btn" data-action="export">导出当前版本</button><button class="btn teal" data-action="close">关闭</button>`,'wide');bindDetail();
    }
    function detailMarkup(bom,version){
      return `<div class="detail-toolbar"><div class="field version"><label>查看版本</label><select class="select" id="detailVersion">${bom.versions.map(item=>`<option ${item.no===version.no?'selected':''}>${item.no}</option>`).join('')}</select></div><div class="field status"><label>版本状态</label><input class="input readonly" value="${esc(version.status)}" readonly></div><div class="field grow"><label>版本范围</label><input class="input readonly" value="${version.l1s.length} 个 L1 总成 · ${flatLines(version).length} 条 BOM 行" readonly></div></div>
        <div class="detail-meta"><div class="kv"><span>来源对象</span><b>${esc(bom.sourceNo)}</b></div><div class="kv"><span>客户 / 产品</span><b>${esc(bom.customer)} · ${esc(bom.product)}</b></div><div class="kv"><span>版本创建人</span><b>${esc(version.createdBy)}</b></div><div class="kv"><span>创建时间</span><b>${esc(version.createdAt)}</b></div><div class="kv"><span>生效时间</span><b>${esc(version.effectiveAt||'尚未生效')}</b></div></div>
        <div class="detail-layout"><aside class="l1-panel"><h3>L1 总成范围</h3><button class="l1-item active" data-l1="all"><b>全部 L1 总成</b><span>${version.l1s.length} 个 L1 · ${flatLines(version).length} 条明细</span></button>${version.l1s.map(l1=>`<button class="l1-item" data-l1="${l1.no}"><b>${esc(l1.no)}</b><span>${esc(l1.name)} · 来源 ${esc(l1.sourceVersion)}</span></button>`).join('')}</aside>

        <div class="section-head"><h3>版本确认摘要</h3><button class="btn link" data-action="history-inline">查看完整历史确认记录</button></div>

    function bindDetail(){
      $('#detailVersion').onchange=e=>{currentVersion=currentBom.versions.find(item=>item.no===e.target.value);modalBody.innerHTML=detailMarkup(currentBom,currentVersion);bindDetail()};
      $$('[data-l1]',modalBody).forEach(button=>button.onclick=()=>{currentL1=button.dataset.l1;$$('[data-l1]',modalBody).forEach(item=>item.classList.toggle('active',item===button));detailLines.innerHTML=detailTable(currentVersion,currentL1)});

    function ensureWorkVersion(bom){

    }
    function showEditor(bom){

      openModal('同步来源 BOM 变更',`<p class="notice warn">检测到项目开发模块中已有 L1 BOM 形成新的已锁定版本。同步后将基于当前生效版本生成 ${nextVersion(bom)} 工作版本，不覆盖历史版本。</p><table class="version-table"><thead><tr><th>L1 总成</th><th>当前生产 BOM 来源</th><th>来源模块最新锁定版本</th><th>处理</th></tr></thead><tbody>${bom.l1Sources.map((item,index)=>`<tr><td>${esc(item.no)}<span class="sub">${esc(item.name)}</span></td><td>${esc(effective(bom).l1s.find(l1=>l1.no===item.no)?.sourceVersion||'—')}</td><td><b>${index===0?'V3.0':item.version}</b></td><td>${index===0?'<span class="tag warn">待同步</span>':'<span class="tag success">无变化</span>'}</td></tr>`).join('')}</tbody></table>`,`<button class="btn" data-action="close">取消</button><button class="btn primary" data-action="do-sync">生成下一工作版本</button>`,'medium');currentBom=bom;
    }
    function doSync(){const draft=ensureWorkVersion(currentBom);draft.changeNote='同步来源模块已确认并锁定的 L1 BOM 变更，待 AE 完成影响分析。';draft.l1s[0].sourceVersion='V3.0';draft.l1s[0].lines.push(line('s'+Date.now(),2,'来源新增零件','SRC-NEW',draft.l1s[0].no,1,'待确认','新增'));currentBom.sourceChanged=false;currentBom.updated=now();closeModal();renderList();toastMessage(`已生成 ${draft.no} 工作版本。`)}

    document.addEventListener('click',event=>{
      const button=event.target.closest('[data-action]');if(!button)return;const bom=db.find(item=>item.id===button.dataset.id);const action=button.dataset.action;
      if(action==='detail')showDetail(bom);if(action==='edit')showEditor(bom);if(action==='submit')showSubmit(bom);if(action==='review')showReview(bom);if(action==='history'||action==='history-inline')showHistory(bom||currentBom);if(action==='sync')showSync(bom);
      if(action==='close')closeModal();if(action==='add-line')addEditorLine();if(action==='save-edit')saveEditor();
      if(action==='do-submit'){currentVersion.status='待 SCM/ME 确认';currentVersion.confirmations={SCM:false,ME:false};currentVersion.approval.unshift({time:now(),role:'AE',user:roles.AE,action:'提交确认',opinion:currentVersion.changeNote});currentBom.updated=now();closeModal();renderList();toastMessage(`${currentVersion.no} 已提交 SCM 与 ME 确认。`)}
      if(action==='approve-review')secondConfirm('approve');if(action==='return-review')secondConfirm('return');if(action==='commit-review')commitReview();if(action==='cancel-second')showReview(pendingAction.bom);if(action==='do-sync')doSync();if(action==='export')toastMessage(`已生成 ${currentBom.name} ${currentVersion.no} 导出文件（演示）。`);
    });
    overview.addEventListener('click',event=>{const button=event.target.closest('[data-workflow]');if(!button)return;workflow=button.dataset.workflow;renderList()});
    $$('.tab').forEach(button=>button.onclick=()=>{activeTab=button.dataset.tab;workflow='all';$$('.tab').forEach(item=>item.classList.toggle('active',item===button));renderList()});
    queryBtn.onclick=renderList;resetBtn.onclick=()=>{numberFilter.value='';nameFilter.value='';keywordFilter.value='';versionFilter.value='';workflow='all';renderList()};
    roleSelect.onchange=()=>{workflow='all';renderList()};modalClose.onclick=closeModal;modalLayer.onclick=event=>{if(event.target===modalLayer)closeModal()};
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!modalLayer.hidden)closeModal()});
    renderList();
  </script>
</body>
</html>
