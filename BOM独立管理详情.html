<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>生产 BOM 明细 · 博格华纳项目开发管理</title>
  <style>
    :root{--blue:#1769e0;--blue-soft:#eef5ff;--line:#dfe5ec;--line-strong:#cbd5e1;--bg:#f4f6f8;--text:#1d2939;--muted:#667085;--surface:#fff;--surface-muted:#f5f7fa;--success:#147a42;--success-bg:#ecfdf3;--warn:#b54708;--warn-bg:#fffaeb;--radius:6px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.page{max-width:1680px;margin:0 auto;padding:24px}.bom-panel{background:var(--surface);border:1px solid var(--line);padding:18px}.bom-top,.bom-title-row,.bom-actions,.bom-meta,.bom-filter,.bom-tools,.version-line{display:flex;align-items:center}.bom-top{justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:16px}.bom-title-row{gap:10px;flex-wrap:wrap}.section-title{margin:0;color:#1d2939;font-size:20px;line-height:1.3}.bom-actions{gap:10px;flex-wrap:wrap;justify-content:flex-end}.bom-meta{gap:8px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px;font-weight:700}.meta-role,.status-pill,.mini-tag{display:inline-flex;align-items:center;min-height:22px;padding:0 7px;border-radius:4px;font-size:12px;font-weight:800}.meta-role{background:#eef2f6;color:#667085}.status-pill{background:var(--success-bg);color:var(--success)}.status-warn{background:var(--warn-bg);color:var(--warn)}.btn{height:34px;border:1px solid var(--line-strong);border-radius:4px;background:#fff;color:#344054;padding:0 12px;font:inherit;font-weight:750;cursor:pointer;transition:border-color .15s,color .15s,background .15s}.btn:hover{border-color:var(--blue);color:var(--blue)}.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn-primary:hover{background:#135fc0;color:#fff}.btn[disabled]{cursor:not-allowed;opacity:.48}.bom-filter{gap:10px;flex-wrap:wrap;padding:12px;background:#f3f6fb;border:1px solid var(--line);margin-bottom:14px}.bom-filter label{display:grid;gap:5px;color:#344054;font-size:12px;font-weight:800}.field,.select-field{height:34px;min-width:190px;border:1px solid var(--line-strong);border-radius:4px;background:#fff;color:#344054;padding:0 10px;font:inherit}.bom-filter-actions{display:flex;gap:10px;align-self:end}.bom-tools{justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 10px;color:var(--muted);font-weight:700}.version-line{gap:10px;flex-wrap:wrap}.bom-table-wrap{width:100%;overflow:auto;border:1px solid var(--line);background:#fff}.bom-table{width:max-content;min-width:100%;table-layout:auto;border-collapse:collapse}.bom-table th,.bom-table td{height:56px;padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:normal;line-height:1.4}.bom-table th{height:48px;background:#f5f7fa;color:#475467;font-size:12px;white-space:nowrap}.bom-table th span,.sub{display:block;color:#8b95a5;font-size:11px;font-weight:700;margin-top:2px}.bom-table tr:hover td{background:#f5f9ff}.bom-table th:nth-child(1),.bom-table td:nth-child(1){min-width:65px}.bom-table th:nth-child(3),.bom-table td:nth-child(3){min-width:240px}.bom-table th:nth-child(21),.bom-table td:nth-child(21){min-width:230px}.bom-table th:last-child,.bom-table td:last-child{position:sticky;right:0;background:#fff;box-shadow:-8px 0 16px rgba(16,24,40,.06);border-left:1px solid var(--line)}.bom-table th:last-child{background:#f5f7fa;z-index:2}.mini-tag{background:#eef2f6;color:#475467;white-space:nowrap}.mini-tag.ok{background:var(--success-bg);color:var(--success)}.mini-tag.warn{background:var(--warn-bg);color:var(--warn)}.link{border:0;background:none;padding:0;color:var(--blue);font:inherit;font-weight:800;cursor:pointer;text-align:left}.summary{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px;margin-bottom:14px}.summary-item{padding:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface-muted)}.summary-item span{display:block;color:var(--muted);font-size:12px;font-weight:800;margin-bottom:8px}.summary-item b{font-size:18px}.empty{padding:32px!important;text-align:center;color:var(--muted)}.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:10;display:none;background:#173b2d;color:#fff;padding:11px 16px;border-radius:5px;font-weight:700;box-shadow:0 10px 24px rgba(16,24,40,.18)}.toast.show{display:block}@media(max-width:800px){.page{padding:16px}.bom-top{display:grid}.summary{grid-template-columns:1fr 1fr}.bom-actions{justify-content:flex-start}.bom-filter label,.field,.select-field{min-width:0;width:100%}.bom-filter label{width:100%}}@media(max-width:480px){.summary{grid-template-columns:1fr}.section-title{font-size:18px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main class="page">
    <section class="bom-panel">
      <div class="bom-top">
        <div>
          <div class="bom-title-row"><h1 class="section-title" id="title">生产 BOM 明细</h1><span class="status-pill" id="status">—</span></div>
          <div class="bom-meta" id="meta"></div>
        </div>
        <div class="bom-actions">
          <button class="btn" id="back">返回 BOM 管理</button>
          <button class="btn" id="export">导出 BOM</button>
          <button class="btn" id="copy">复制 BOM</button>
          <button class="btn" id="tasks">APQP 任务</button>
          <button class="btn btn-primary" id="createApqp">创建 APQP</button>
          <button class="btn btn-primary" id="createDfm">创建 DFM</button>
          <button class="btn btn-primary" id="edit">编辑 BOM</button>
        </div>
      </div>
      <div class="summary" id="summary"></div>
      <div class="bom-filter">
        <label>零件编号<input class="field" id="partNo" type="search" placeholder="输入 BW / SAP / 原材料零件号"></label>
        <label>零件名称<input class="field" id="partName" type="search" placeholder="输入零件 / 材料名称"></label>
        <label>供应类型<select class="select-field" id="supply"><option value="">全部</option><option>一供</option><option>二供</option></select></label>
        <div class="bom-filter-actions"><button class="btn btn-primary" id="query">查询</button><button class="btn" id="reset">重置</button></div>
      </div>
      <div class="bom-tools"><div class="version-line"><span id="display">显示：完整层级</span><span id="rowCount">0 项</span></div><span>完整字段通过横向滚动查看</span></div>
      <div class="bom-table-wrap"><table class="bom-table" aria-label="生产BOM明细"><thead id="head"></thead><tbody id="body"></tbody></table></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <div id="taskModal" hidden style="position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:5;padding:20px;align-items:center;justify-content:center"><section style="width:min(760px,100%);max-height:80vh;overflow:auto;background:#fff;border-radius:6px;box-shadow:0 16px 40px rgba(16,24,40,.24)"><header style="display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid #dfe5ec"><b>关联 APQP / DFM 任务</b><button class="btn" id="closeTasks">关闭</button></header><pre id="taskText" style="margin:0;padding:18px;white-space:pre-wrap;font:13px/1.7 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif"></pre></section></div>
  <script>
  'use strict';
  const KEY='bw-independent-bom-v1';const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
  const fields=[['application','产品应用','Product Application'],['level','级数','Level'],['name','零件 / 材料名称','Part/material name'],['qty','数量','Qty'],['customerNo','客户零件号','customer Part NO.'],['bwNo','BW 零件号','BW Part NO.'],['drawingRev','图纸版本','DRW Rev.'],['sampleSapNo','样件 SAP 零件号','SAP_Proto'],['massSapNo','量产 SAP 零件号','SAP_SOP'],['rawNo','原材料零件号','SAP'],['rawMaterial','原材料','Raw Material'],['weightPiece','重量 Piece(g)','Weight Piece(g)'],['weightAssembly','重量 Assembly(g)','Weight Assembly(g)'],['sharedPart','共用零件','Common'],['borrowedProject','借用项目','Borrowed Project'],['releaseStatus','图纸状态','DRW Status'],['rawSupplier','原材料供应商名称','Raw Supplier'],['subSupplier','分供方名称','Sub Supplier'],['supplyType','供应类型','Supply Type'],['change','版本对比','Version Compare'],['remark','备注','Remark']];
  const query=new URLSearchParams(location.search),id=query.get('id'),versionId=query.get('version');let db=[];try{db=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{}let bom=db.find(x=>x.id===id),version=bom?.versions.find(x=>x.id===versionId)||bom?.versions.at(-1);const latest=()=>bom?.versions.at(-1),active=()=>bom?.versions.find(x=>x.status==='已锁定生效'),root=()=>version?.lines.find(x=>Number(x.level)===1);
  function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').classList.remove('show'),2600)}function badge(s){return `<span class="mini-tag ${s==='已锁定生效'?'ok':s==='草稿'||s==='待 SCM 确认'?'warn':''}">${esc(s)}</span>`}function update(){localStorage.setItem(KEY,JSON.stringify(db));}function render(){if(!bom||!version){$('#body').innerHTML='<tr><td class="empty" colspan="24">未找到 BOM 数据。请从 BOM 管理列表重新打开明细。</td></tr>';return}let r=root(),a=active();$('#title').textContent=`生产 BOM 明细 · ${bom.id}`;$('#status').outerHTML=badge(version.status);$('#meta').innerHTML=`<span>当前查看：${esc(version.name)}</span><span class="meta-role">创建来源：${esc(bom.source)}</span><span>关联：${esc(bom.target||'未关联')}</span><span>AE：${esc(bom.ae)}</span><span>SCM：${esc(bom.scm)}</span>`;$('#summary').innerHTML=[['L1 总成',r?.name||'—'],['当前生效版本',a?.name||'尚无'],['最新工作版本',latest()?.name||'—'],['关联任务',bom.tasks?.length||0]].map(x=>`<div class="summary-item"><span>${x[0]}</span><b>${esc(x[1])}</b></div>`).join('');$('#head').innerHTML=`<tr><th>序号<span>No.</span></th>${fields.map(f=>`<th>${f[1]}<span>${f[2]}</span></th>`).join('')}<th>供应方案 / APQP<span>Operation</span></th></tr>`;let q=($('#partNo').value+' '+$('#partName').value).trim().toLowerCase(),s=$('#supply').value,rows=version.lines.filter(l=>!q||Object.values(l).join(' ').toLowerCase().includes(q)).filter(l=>!s||l.plans.some(p=>p.type===s));$('#body').innerHTML=rows.length?rows.map((l,i)=>`<tr><td>${i+1}</td>${fields.map(([k])=>`<td>${k==='name'?`<b>${esc(l[k])}</b><span class="sub">父级：${esc(version.lines.find(p=>p.id===l.parent)?.bwNo||'—')}</span>`:k==='supplyType'?esc(l.plans.map(p=>p.type+'：'+p.supplier).join('；')||l[k]||'—'):esc(l[k]||'—')}</td>`).join('')}<td>${l.plans.length?l.plans.map(p=>`<div>${badge(p.type)} ${esc(p.supplier)} · ${esc(p.strategy)}<span class="sub">${p.apqp==='是'?'可创建 APQP':'不生成 APQP'} / ${esc(p.owner)}</span></div>`).join(''):'内部装配'}</td></tr>`).join(''):'<tr><td class="empty" colspan="23">没有符合条件的 BOM 行。</td></tr>';$('#rowCount').textContent=rows.length+' 项';let can=version.status==='已锁定生效';$('#createApqp').disabled=!can;$('#createDfm').disabled=!can;$('#edit').disabled=version!==latest()||!['草稿','已锁定生效'].includes(version.status)};
  function createTasks(type){let made=0;version.lines.filter(l=>Number(l.level)>1).forEach(l=>l.plans.filter(p=>p.apqp==='是'&&p.develop==='是'&&!bom.tasks.some(t=>t.type===type&&t.versionId===version.id&&t.lineId===l.id&&t.planId===p.id)).forEach(p=>{bom.tasks.push({id:type+'-'+Date.now().toString(36)+'-'+(++made),type,versionId:version.id,lineId:l.id,planId:p.id,part:l.bwNo,name:l.name,supplier:p.supplier,owner:p.owner,status:'未启动'});}));if(made){update();toast('已创建 '+made+' 条 '+type+' 任务。');setTimeout(()=>location.reload(),450)}else toast('没有可创建的任务，或任务已存在。')}
  $('#back').onclick=()=>history.back();
  $('#query').onclick=render;$('#reset').onclick=()=>{$('#partNo').value='';$('#partName').value='';$('#supply').value='';render()};
  ['partNo','partName'].forEach(i=>$('#'+i).onkeydown=e=>{if(e.key==='Enter')render()});$('#supply').onchange=render;
  $('#edit').onclick=()=>location.href='BOM独立管理.html?edit='+encodeURIComponent(bom.id);
  $('#copy').onclick=()=>location.href='BOM独立管理.html?copy='+encodeURIComponent(bom.id)+'&version='+encodeURIComponent(version.id);
  $('#export').onclick=()=>{let rows=[['BOM编号','BOM版本',...fields.map(f=>f[1])],...version.lines.map(l=>[bom.id,version.name,...fields.map(([k])=>l[k]||'')])],csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`生产BOM_${bom.id}_${version.name}.csv`;a.click();toast('已导出 BOM。')};
  $('#tasks').onclick=()=>{let text=(bom.tasks||[]).filter(t=>t.versionId===version.id).map(t=>`${t.id} · ${t.type} · ${t.part} / ${t.supplier} · ${t.status}`).join('\n')||'当前版本暂无 APQP / DFM 任务。';$('#taskText').textContent=text;$('#taskModal').hidden=false;$('#taskModal').style.display='flex'};
  $('#closeTasks').onclick=()=>{$('#taskModal').hidden=true;$('#taskModal').style.display='none'};
  function filterDetailRows(){let q=($('#partNo').value+' '+$('#partName').value).trim().toLowerCase(),s=$('#supply').value,shown=0;[...$('#body').rows].forEach(row=>{let match=(!q||row.innerText.toLowerCase().includes(q))&&(!s||row.innerText.includes(s));row.style.display=match?'':'none';if(match)shown++});$('#rowCount').textContent=shown+' 项';}
  $('#query').onclick=filterDetailRows;$('#reset').onclick=()=>{$('#partNo').value='';$('#partName').value='';$('#supply').value='';filterDetailRows()};
  $('#createApqp').onclick=()=>createTasks('APQP');$('#createDfm').onclick=()=>createTasks('DFM');
  render();
  </script>
</body></html>
